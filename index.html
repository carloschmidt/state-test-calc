<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Scientific Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathlive@0.109.2/dist/mathlive-static.css" />
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathlive@0.109.2/mathlive.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.min.js"></script>
<!-- jStat: probability distributions & inference. MIT. -->
<script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>
<!-- function-plot: D3-based plotter that uses math.js for evaluation. UMD bundle includes D3. -->
<script src="https://cdn.jsdelivr.net/npm/function-plot@1.25.1/dist/function-plot.js"></script>
<!-- fmin: small numerical optimizer (Nelder-Mead) for nonlinear regression. MIT. -->
<script src="https://cdn.jsdelivr.net/npm/fmin@0.0.2/build/fmin.min.js"></script>
<style>
  :root {
    /* Formative palette */
    --bg: #FFFFFF;            /* card / app background */
    --panel: #F7F8F8;         /* secondary surface (keypad tray) */
    --border: #E3E5E8;        /* subtle divider */
    --ink: #1D1D1D;           /* title / strong text */
    --muted: #424147;         /* body text */
    --blue: #0D64F2;          /* Core Blue 700 — primary */
    --blue-hover: #114DBC;    /* primary hover */
    --blue-pressed: #144494;  /* primary pressed */
    --blue-tint: #E6F0FF;     /* secondary hover background tint */
    --blue-soft: #E5EEFE;     /* active-state pill background */
    --key: #FFFFFF;
    --key-num: #ECEEF0;       /* slightly darker than secondary surface */
    --key-hover: #F2F4F6;
    --key-num-hover: #DDE0E4;
    /* Formative button universals */
    --btn-radius: 8px;
    --btn-transition: all 0.3s;
    --btn-focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue);
    /* Formative error / warning */
    --danger-600: #C32113;
    --danger-700: #A50000;
    --danger-bg:  #FFE2E2;
    --warning-600: #BC8100;
    --warning-700: #996500;
    --warning-bg:  #FFF8D2;
  }
  * { box-sizing: border-box; }
  /* Visually hidden but available to assistive tech. Standard clip pattern. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--panel);
    font-family: 'Open Sans', sans-serif;
    color: var(--ink);
    height: 100%;
  }
  /* Top-level view tabs ("Scientific" / "Graphing") */
  .top-tabs {
    max-width: 1280px;
    margin: 16px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .top-tab {
    cursor: pointer;
    padding: 12px 20px;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: var(--btn-transition);
  }
  .top-tab:focus-visible {
    outline: none;
    box-shadow: var(--btn-focus-ring);
    border-radius: var(--btn-radius);
  }
  .top-tab:hover:not(.active) { color: var(--blue); }
  .top-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .last-updated {
    margin-left: auto;
    align-self: center;
    font-family: 'Open Sans', sans-serif;
    font-size: 12px;
    color: var(--muted);
    padding-right: 4px;
  }
  .last-updated[hidden] { display: none; }

  /* View containers */
  .view { display: none; }
  .view.active { display: block; }

  .app {
    max-width: 760px;
    margin: 24px auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }

  /* --- Graphing view --- */
  .graph-app {
    max-width: 1280px;
    margin: 16px auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: 1fr auto;
    grid-template-areas:
      "sidebar graph"
      "keypad  keypad";
    height: calc(100vh - 100px);
    min-height: 600px;
  }
  /* Narrow viewport: stack sidebar above graph */
  @media (max-width: 900px) {
    .graph-app {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "sidebar"
        "graph"
        "keypad";
    }
    .expr-list { max-height: 200px; border-right: 0; border-bottom: 1px solid var(--border); }
  }
  .expr-list {
    grid-area: sidebar;
    border-right: 1px solid var(--border);
    background: var(--bg);
    overflow-y: auto;
    padding: 8px;
  }
  .expr-list .add-expr {
    display: block;
    width: 100%;
    padding: 10px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    margin-top: 6px;
    transition: var(--btn-transition);
  }
  .expr-list .add-expr:hover { color: var(--blue); border-color: var(--blue); background: var(--blue-tint); }
  .expr-row {
    display: grid;
    grid-template-columns: 32px 1fr 32px;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    transition: var(--btn-transition);
    background: var(--bg);
  }
  .expr-row:focus-within { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-tint); }
  .expr-row .expr-color {
    width: 28px; height: 28px; border-radius: 6px; margin: 4px;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .expr-row .expr-color svg { width: 18px; height: 18px; }
  .expr-row math-field {
    border: 0; outline: none; padding: 10px 6px; min-height: 44px;
    font-size: 18px;
    background: transparent;
  }
  .expr-row math-field::part(virtual-keyboard-toggle),
  .expr-row math-field::part(menu-toggle) { display: none; }
  .expr-row .expr-delete {
    background: transparent; border: 0; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
    width: 28px; height: 28px; border-radius: 50%;  /* WCAG 2.5.8 */
    display: flex; align-items: center; justify-content: center;
    transition: var(--btn-transition);
  }
  .expr-row .expr-delete:hover { background: var(--danger-bg); color: var(--danger-700); }

  .expr-row.slider-row {
    background: #FAFAFB;
    align-items: center;
    padding: 6px 10px;
    gap: 10px;
  }
  .slider-row .slider-label {
    font: 600 13px/1 'Open Sans', sans-serif;
    min-width: 70px;
    white-space: nowrap;
  }
  .slider-row .slider-val { color: var(--blue); margin-left: 4px; }
  .slider-row .slider-input { flex: 1; }

  .add-menu { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; }
  .expr-row.table-row {
    flex-direction: column;
    align-items: stretch;
    padding: 8px;
    gap: 6px;
  }
  .table-row .table-header { display: flex; justify-content: space-between; font: 600 12px/1.2 'Open Sans', sans-serif; align-items: center; gap: 8px; }
  .table-row .table-header code { font-size: 11px; color: var(--muted); }
  .table-row table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-row table th, .table-row table td { border: 1px solid var(--border); padding: 2px; }
  .table-row table th { background: var(--panel); font-weight: 600; }
  .table-row table input {
    width: 100%; border: none; font: inherit; padding: 4px 6px;
    outline: none; background: transparent;
  }
  .table-row table input:focus { background: var(--blue-tint); }
  .table-row .table-paste { font-size: 12px; color: var(--blue); cursor: pointer; background: none; border: 0; padding: 0; }
  .table-row .table-paste:hover { text-decoration: underline; }

  .expr-row.regression-row { align-items: center; }
  .regression-row .reg-result { font-size: 11px; color: var(--muted); white-space: nowrap; padding: 0 8px; }

  .graph-area {
    grid-area: graph;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }
  #graph {
    width: 100%;
    height: 100%;
  }
  #graph svg { display: block; }
  /* Scatter dots default to r=1 in function-plot; bump to r=3 so plotted points
     match the size of the hover indicator circle that appears on curves. */
  #graph svg circle.scatter { r: 3; }
  #graph.hide-x-axis .x.axis { display: none; }
  #graph.hide-y-axis .y.axis { display: none; }
  #graph.hide-axis-numbers .x.axis .tick text,
  #graph.hide-axis-numbers .y.axis .tick text { display: none; }

  /* Gear icon anchored to graph */
  .graph-gear {
    position: absolute;
    top: 10px; right: 10px;
    width: 36px; height: 36px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: var(--btn-transition);
    z-index: 10;
  }
  .graph-gear:hover { background: var(--blue-tint); color: var(--blue); border-color: var(--blue); }
  .graph-gear svg { width: 20px; height: 20px; }

  /* Settings panel */
  .graph-settings {
    position: absolute;
    top: 56px; right: 10px;
    width: 320px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    padding: 12px 14px;
    z-index: 20;
    display: none;
    font-family: 'Open Sans', sans-serif;
    font-size: 14px;
  }
  .graph-settings.open { display: block; }
  .graph-settings hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
  .gs-row {
    display: flex; align-items: center; gap: 10px;
    margin: 8px 0;
  }
  .gs-row label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .gs-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; }
  /* Tiny mini-buttons used for visual sub-options (e.g. cartesian/polar grid) */
  .gs-mini {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted);
    transition: var(--btn-transition);
  }
  .gs-mini.active { background: var(--blue-tint); border-color: var(--blue); color: var(--blue); }
  .gs-mini.gs-mini-disabled {
    opacity: 0.45;
    cursor: not-allowed;
    color: var(--muted);
  }
  .gs-mini.gs-mini-disabled:hover { background: var(--panel); color: var(--muted); }
  .gs-mini svg { width: 18px; height: 18px; }

  /* Axis range row */
  .gs-axis-range {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 6px;
    font-family: 'KaTeX_Main', 'Open Sans', serif;
    font-size: 14px;
  }
  .gs-axis-range input {
    width: 100%;
    padding: 4px 6px;
    border: 0;
    border-bottom: 1px solid var(--ink);
    font: inherit;
    background: transparent;
    text-align: center;
  }
  .gs-axis-range input:focus { outline: none; border-bottom-color: var(--blue); }
  .gs-label-input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-family: 'Open Sans', sans-serif;
    background: var(--bg);
  }
  .gs-label-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-tint); }
  .gs-label-wrap {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    position: relative;
  }
  .gs-label-wrap .lbl {
    position: absolute;
    top: -8px; left: 8px; padding: 0 4px;
    background: var(--bg);
    font-size: 11px; color: var(--muted);
  }
  .gs-label-wrap input { border: 0; outline: none; width: 100%; font: inherit; background: transparent; padding: 2px 0; }
  .gs-step { display: inline-flex; align-items: center; gap: 4px; }
  .gs-step input { width: 50px; }

  /* Radians/Degrees pill (visual stub — function-plot is unitless) */
  .gs-angle-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 4px;
  }
  .gs-angle-toggle button {
    border: 0; padding: 8px;
    font: inherit; font-weight: 600;
    background: var(--bg); color: var(--ink);
    cursor: pointer;
  }
  .gs-angle-toggle button.active { background: var(--ink); color: var(--bg); }

  .gs-more {
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer; color: var(--ink);
    user-select: none;
  }
  .gs-more::before {
    content: '▶'; font-size: 10px;
    display: inline-block;
    transition: transform .2s;
  }
  .gs-more.open::before { transform: rotate(90deg); }

  /* f(x) function library panel — slides up from the keypad */
  .fn-panel {
    position: absolute;
    left: 360px;          /* sits to the right of the sidebar */
    right: 0;
    bottom: 0;            /* sits flush above the keypad — set dynamically */
    max-height: 480px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 -4px 16px rgba(0,0,0,.08);
    z-index: 30;
    display: none;
    flex-direction: column;
    font-family: 'Open Sans', sans-serif;
  }
  .fn-panel.open { display: flex; }
  @media (max-width: 900px) {
    .fn-panel { left: 0; }
  }
  .fn-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    color: var(--ink);
  }
  .fn-panel-close {
    background: transparent; border: 0; font-size: 22px; line-height: 1;
    width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; color: var(--muted);
    transition: var(--btn-transition);
  }
  .fn-panel-close:hover { background: var(--blue-tint); color: var(--blue); }
  .fn-panel-body {
    overflow-y: auto;
    padding: 12px 16px 16px;
    flex: 1;
  }
  .fn-section { margin-bottom: 18px; }
  .fn-section h4 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .fn-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .fn-btn {
    position: relative;
    background: var(--key-num);
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 44px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    transition: var(--btn-transition);
    font-family: 'Open Sans', sans-serif;
    padding: 0 8px;
  }
  .fn-btn:hover:not(.unwired) { background: var(--key-num-hover); border-color: var(--blue); }
  .fn-btn .katex { font-size: 1em; }
  /* Unwired = not yet implemented — visible in the UI but inactive */
  .fn-btn.unwired {
    color: #6E6E73;
    background: var(--key-num);
    cursor: not-allowed;
  }
  .fn-btn.unwired:hover {
    background: var(--key-num);
    border-color: var(--border);
  }
  .fn-badge {
    position: absolute;
    top: -6px;
    right: 6px;
    font-family: 'Open Sans', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--warning-700);
    background: var(--warning-bg);
    border: 1px solid var(--warning-600);
    border-radius: 999px;
    padding: 1px 6px;
    line-height: 1;
    pointer-events: none;
  }

  /* Graphing keypad — 10-col horizontal layout */
  .graph-keypad {
    grid-area: keypad;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 0 12px 10px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
  }
  .graph-keypad .keypad-toggle { grid-column: 1 / -1; }
  /* Alphabet keypad: 20-col grid (every key spans 2 cols), like scientific abc */
  .graph-alpha-rows {
    grid-column: 1 / -1;
    display: none;
    grid-template-columns: repeat(20, 1fr);
    gap: 6px;
  }
  .graph-alpha-rows .key { grid-column: span 2; }
  .graph-alpha-rows .graph-alpha-offset { grid-column: 2 / span 2; }
  .graph-alpha-rows .key.wide { grid-column: span 2; }
  /* Mode swap: hide the active set */
  .graph-keypad[data-mode="alpha"] > :not(.keypad-toggle):not(.graph-alpha-rows) { display: none; }
  .graph-keypad[data-mode="alpha"] .graph-alpha-rows { display: grid; }
  .graph-keypad .key {
    background: var(--key);
    border: 1px solid var(--border);
    border-radius: var(--btn-radius);
    height: 44px;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    transition: var(--btn-transition);
    color: var(--ink);
    padding: 0;
    gap: 8px;
  }
  .graph-keypad .key:hover { background: var(--key-hover); }
  .graph-keypad .key.num  { background: var(--key-num); }
  .graph-keypad .key.num:hover { background: var(--key-num-hover); }
  .graph-keypad .key.wide { grid-column: span 2; }
  .graph-keypad .key.enter { grid-column: span 2; background: var(--blue); color: #fff; border-color: var(--blue); }
  .graph-keypad .key.enter:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
  .graph-keypad .key svg { width: 18px; height: 18px; }
  .history {
    min-height: 240px;
    max-height: 360px;
    overflow-y: auto;
    background: #fff;
  }
  .history .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    font-size: 18px;
    min-height: 64px;
  }
  .history .blank-row {
    min-height: 120px;
    border-top: none;
  }
  .history .expr { flex: 1; }
  .history .res {
    display: flex; align-items: center; gap: 12px;
    color: var(--ink);
  }
  .frac-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--btn-radius);
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    font: 600 12px/1 'Open Sans', sans-serif;
    transition: var(--btn-transition);
    margin-left: 4px;
    flex-shrink: 0;
  }
  .frac-toggle:hover { background: var(--blue-tint); color: var(--blue); border-color: var(--blue); }
  .frac-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .frac-toggle svg { width: 20px; height: 20px; }
  .frac-toggle[hidden] { display: none; }
  /* Status chips for error / warning results */
  .status-chip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid;
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'Open Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.2;
    min-height: 32px;
    box-sizing: border-box;
  }
  .status-chip svg { width: 18px; height: 18px; flex-shrink: 0; }
  .status-chip.error {
    color: var(--danger-700);
    border-color: var(--danger-600);
    background: var(--danger-bg);
  }
  .status-chip.error svg { fill: var(--danger-600); }
  .status-chip.warning {
    color: var(--warning-700);
    border-color: var(--warning-600);
    background: var(--warning-bg);
  }
  .status-chip.warning svg { fill: var(--warning-600); }
  .input-wrap {
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    background: #fff;
    position: relative;
  }
  .input-frac-toggle {
    position: absolute;
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  math-field {
    display: block;
    width: 100%;
    min-height: 52px;
    font-size: 24px;
    border: 2px solid var(--blue);
    border-radius: 4px;
    padding: 10px 14px;
    background: #fff;
    outline: none;
    --caret-color: var(--blue);
  }
  math-field::part(virtual-keyboard-toggle),
  math-field::part(menu-toggle) { display: none; }
  .keypad {
    background: var(--panel);
    padding: 10px 12px 14px;
    border-top: 1px solid var(--border);
    position: relative;
  }

  /* Collapse handle — sits at the top of the keypad as a thin bar */
  .keypad-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 28px;          /* WCAG 2.5.8: target ≥ 24×24 CSS px */
    padding: 3px 0;
    background: transparent;
    border: 0;
    cursor: pointer;
    color: var(--muted);
    transition: var(--btn-transition);
    border-radius: 0 0 8px 8px;
  }
  .keypad-toggle:hover { color: var(--blue); background: var(--key-hover); }
  .keypad-toggle svg {
    width: 22px; height: 22px;
    transition: transform 0.3s;
  }
  /* When collapsed, point arrow upward and hide everything inside the
     keypad except the toggle itself. */
  .keypad.collapsed > :not(.keypad-toggle),
  .graph-keypad.collapsed > :not(.keypad-toggle) { display: none; }
  .keypad.collapsed .keypad-toggle svg,
  .graph-keypad.collapsed .keypad-toggle svg { transform: rotate(180deg); }
  .keypad.collapsed { padding-bottom: 0; }
  .graph-keypad.collapsed { padding: 0 12px; }
  .toprow {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 4px 12px;
    font-size: 15px;
    color: var(--muted);
  }
  .tabs { display: flex; gap: 22px; }
  .tab {
    cursor: pointer;
    padding: 4px 6px;
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 28px;
    font: inherit;
    transition: var(--btn-transition);
  }
  .tab:focus-visible {
    outline: none;
    box-shadow: var(--btn-focus-ring);
    border-radius: var(--btn-radius);
  }
  .tab:hover:not(.active) { color: var(--blue); }
  .tab svg { width: 20px; height: 20px; }
  .tab.tab-func { font-size: 16px; line-height: 1; }
  .tab.tab-func .katex { font-size: 1em; }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
  .angle {
    display: inline-flex;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: var(--btn-radius);
    overflow: hidden;
    background: #fff;
  }
  .angle button {
    border: 0;
    padding: 4px 12px;
    background: #fff;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    transition: var(--btn-transition);
  }
  .angle button:hover:not(.active) { background: var(--blue-tint); color: var(--blue); }
  .angle button.active { background: var(--blue-soft); color: var(--blue); }
  .icon-btn {
    background: transparent; border: 0; cursor: pointer;
    color: var(--muted); padding: 6px;
    border-radius: var(--btn-radius);
    display: inline-flex; align-items: center; justify-content: center;
    transition: var(--btn-transition);
  }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .icon-btn:hover:not(:disabled) { background: var(--blue-tint); color: var(--blue); }
  .icon-btn svg { width: 22px; height: 22px; }
  .spacer { flex: 1; }
  /* Tertiary button — clear all */
  .clear-all {
    cursor: pointer; color: var(--blue); font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    padding: 4px 8px;
    background: transparent;
    border: 0;
    border-radius: var(--btn-radius);
    font-family: 'Open Sans', sans-serif;
    transition: var(--btn-transition);
  }
  .clear-all:hover { background: var(--blue-tint); }
  .clear-all:focus-visible {
    outline: none;
    box-shadow: var(--btn-focus-ring);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
  }
  .key {
    background: var(--key);
    border: 1px solid var(--border);
    border-radius: var(--btn-radius);
    height: 48px;
    min-height: 32px;        /* Formative min touch target */
    padding: 0 16px;          /* Formative horizontal padding */
    font-size: 17px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;                 /* Formative icon ↔ text gap */
    user-select: none;
    transition: var(--btn-transition);
    color: var(--ink);
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;         /* Formative Semibold */
  }
  .key:hover { background: var(--key-hover); }
  .key:active { background: var(--key-num-hover); }
  .key:focus-visible { outline: none; box-shadow: var(--btn-focus-ring); }
  .key.is-disabled {
    color: #6E6E73;            /* 5.96:1 on white, meets AA 4.5:1 even though disabled is exempt */
    background: var(--key-num);
    border-color: var(--border);
    cursor: not-allowed;
    pointer-events: none;
  }
  .key.num { background: var(--key-num); }
  .key.num:hover { background: var(--key-num-hover); }
  /* Primary CTA — Enter */
  .key.enter {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
    grid-column: span 2;
  }
  .key.enter:hover  { background: var(--blue-hover);   border-color: var(--blue-hover); }
  .key.enter:active { background: var(--blue-pressed); border-color: var(--blue-pressed); }
  .key.wide { grid-column: span 2; }
  .key svg { width: 18px; height: 18px; }
  .key .katex { font-size: 1em; }
  .panel { display: none; }
  .panel.active { display: grid; }
  /* abc keyboard: 20-col grid so row 2 can offset by 1 col (half a key) */
  .panel[data-panel="abc"] { grid-template-columns: repeat(20, 1fr); }
  .panel[data-panel="abc"] .key { grid-column: span 2; }
  .panel[data-panel="abc"] .row2-offset { grid-column: 2 / span 2; }
  .panel[data-panel="abc"] #abc-shift { grid-column: span 3; }
  .panel[data-panel="abc"] .key.enter { grid-column: span 3; }
  .panel[data-panel="abc"] .abc-letter { font-style: normal; }
  .panel[data-panel="abc"].shift-on .abc-letter { text-transform: uppercase; }
  .panel[data-panel="abc"].shift-on #abc-shift { background: var(--blue-soft); color: var(--blue); }
  /* func keyboard: 7 cols with col 4 acting as a gap */
  .panel[data-panel="func"] { grid-template-columns: repeat(7, 1fr); }
  .panel[data-panel="func"] .gap { background: transparent; border: 0; pointer-events: none; }
  .panel[data-panel="func"] .key.enter { grid-column: span 1; }
  .small-note {
    font-size: 14px; color: var(--muted); text-align: center; padding: 20px;
  }

  /* Global focus indicator — applies to interactive controls that lack a
     more specific :focus-visible rule. Uses --btn-focus-ring (2px white ring
     + 2px blue) which yields ~5.4:1 contrast against the white surface, well
     above WCAG 1.4.11's 3:1 minimum for non-text contrast. */
  .gs-mini:focus-visible,
  .icon-btn:focus-visible,
  .fn-panel-close:focus-visible,
  .expr-delete:focus-visible,
  .add-expr:focus-visible,
  .keypad-toggle:focus-visible,
  .graph-gear:focus-visible,
  .fn-btn:focus-visible,
  .angle button:focus-visible,
  .gs-angle-toggle button:focus-visible {
    outline: none;
    box-shadow: var(--btn-focus-ring);
  }
</style>
</head>

    <!-- main panel: 9-column grid -->

      </button>

<script>
(function () {
  // -------------------------------------------------------------------
  // Extend math.js with calculator-specific helpers and wrappers around
  // the jStat probability library. Registered once before any evaluation.
  // -------------------------------------------------------------------
  (function registerCustomFunctions() {
    if (typeof math === 'undefined' || !math.import) return;
    const J = (typeof jStat !== 'undefined') ? jStat : null;

    // Helper to flatten args: jStat methods want arrays, math.js calls
    // arrive either as varargs or with the data already as a Matrix.
    function flatten(args) {
      const out = [];
      const visit = v => {
        if (v == null) return;
        if (Array.isArray(v)) v.forEach(visit);
        else if (v && typeof v.toArray === 'function') v.toArray().forEach(visit);
        else out.push(typeof v === 'number' ? v : Number(v));
      };
      args.forEach(visit);
      return out;
    }

    math.import({
      // ===== Statistics =====
      count(...args) { return flatten(args).length; },
      quartile(...args) {
        // quartile(d1, d2, ..., q) — last arg is quartile index (0-4)
        const arr = flatten(args);
        const q = arr.pop();
        return math.quantileSeq(arr, q / 4);
      },

      // ===== List operations (varargs versions for our calculator UX) =====
      length(...args) { return flatten(args).length; },
      sort(...args) {
        const a = flatten(args).slice().sort((x, y) => x - y);
        return math.matrix(a);
      },
      reverse(...args) { return math.matrix(flatten(args).slice().reverse()); },
      unique(...args) {
        const seen = new Set();
        const out = [];
        for (const v of flatten(args)) if (!seen.has(v)) { seen.add(v); out.push(v); }
        return math.matrix(out);
      },
      join(...args) { return math.matrix(flatten(args)); },
      // range(start, end, step?) — handles reversed bounds, defaults step=1.
      range(start, end, step) {
        if (end === undefined) { end = start; start = 1; }
        if (start === end) return math.matrix([start]);
        const dir = end > start ? 1 : -1;
        const stepAbs = step === undefined ? 1 : Math.abs(step);
        const stepSigned = stepAbs * dir;
        if (stepAbs === 0) return NaN;
        const out = [];
        for (let i = start; (dir > 0 ? i <= end + 1e-12 : i >= end - 1e-12); i += stepSigned) out.push(i);
        return math.matrix(out);
      },

      // ===== Geometry =====
      distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); },
      midpoint(x1, y1, x2, y2) { return math.matrix([(x1 + x2) / 2, (y1 + y2) / 2]); },
      slope(x1, y1, x2, y2) {
        // Vertical line OR coincident point → undefined (NaN propagates to "undefined" chip).
        if (x2 - x1 === 0) return NaN;
        return (y2 - y1) / (x2 - x1);
      },
      // Angle between two vectors from origin; returns radians.
      // A zero-magnitude vector makes the angle undefined.
      angle(x1, y1, x2, y2) {
        const dot = x1 * x2 + y1 * y2;
        const m1 = Math.hypot(x1, y1), m2 = Math.hypot(x2, y2);
        if (m1 === 0 || m2 === 0) return NaN;
        return Math.acos(Math.max(-1, Math.min(1, dot / (m1 * m2))));
      },

      // ===== Probability distributions (jStat-backed; pdf-by-default) =====
      // Each call signature: dist(x, ...params) → pdf/pmf at x.
      // Invalid parameters return NaN (→ "undefined" chip); out-of-support
      // values that are still valid (e.g. negative k for poisson) return 0.
      normaldist(x, mu, sigma) {
        if (!J) return NaN;
        mu = mu ?? 0; sigma = sigma ?? 1;
        if (!(sigma > 0)) return NaN;
        return J.normal.pdf(x, mu, sigma);
      },
      tdist(x, df) {
        if (!J) return NaN;
        if (!(df > 0)) return NaN;
        return J.studentt.pdf(x, df);
      },
      chisqdist(x, df) {
        if (!J) return NaN;
        if (!(df > 0)) return NaN;
        if (x < 0) return 0;
        return J.chisquare.pdf(x, df);
      },
      fdist(x, df1, df2) {
        if (!J) return NaN;
        if (!(df1 > 0) || !(df2 > 0)) return NaN;
        if (x < 0) return 0;
        return J.centralF.pdf(x, df1, df2);
      },
      binomdist(k, n, p) {
        if (!J) return NaN;
        if (!Number.isInteger(n) || n < 0) return NaN;
        if (p < 0 || p > 1) return NaN;
        if (!Number.isInteger(k) || k < 0 || k > n) return 0;
        return J.binomial.pdf(k, n, p);
      },
      poissondist(k, lambda) {
        if (!J) return NaN;
        if (!(lambda > 0)) return NaN;
        if (!Number.isInteger(k) || k < 0) return 0;
        return J.poisson.pdf(k, lambda);
      },
      normalcdf(x, mu, sigma) {
        if (!J) return NaN;
        mu = mu ?? 0; sigma = sigma ?? 1;
        if (!(sigma > 0)) return NaN;
        return J.normal.cdf(x, mu, sigma);
      },

      // ===== Inference =====
      // Each returns a single scalar (p-value or statistic). NaN signals
      // degenerate inputs (e.g. zero variance) → "undefined" chip.
      ttest(sampleMean, sampleSd, n, hypMean) {
        if (!J) return NaN;
        if (!(sampleSd > 0) || !(n > 1)) return NaN;
        hypMean = hypMean ?? 0;
        const t = (sampleMean - hypMean) / (sampleSd / Math.sqrt(n));
        return 2 * (1 - J.studentt.cdf(Math.abs(t), n - 1));
      },
      ztest(sampleMean, popSd, n, hypMean) {
        if (!J) return NaN;
        if (!(popSd > 0) || !(n > 0)) return NaN;
        hypMean = hypMean ?? 0;
        const z = (sampleMean - hypMean) / (popSd / Math.sqrt(n));
        return 2 * (1 - J.normal.cdf(Math.abs(z), 0, 1));
      },
      chitest(observed, expected) {
        if (!J) return NaN;
        if (!(expected > 0)) return NaN;
        return Math.pow(observed - expected, 2) / expected;
      },
      ftest(var1, var2) {
        if (!J) return NaN;
        if (!(var2 > 0)) return NaN;
        return var1 / var2;
      },
      sproptest(success, n, hypProp) {
        if (!J) return NaN;
        if (!(n > 0)) return NaN;
        hypProp = hypProp ?? 0.5;
        if (hypProp <= 0 || hypProp >= 1) return NaN;
        const p = success / n;
        const z = (p - hypProp) / Math.sqrt(hypProp * (1 - hypProp) / n);
        return 2 * (1 - J.normal.cdf(Math.abs(z), 0, 1));
      },
      tproptest(s1, n1, s2, n2) {
        if (!J) return NaN;
        if (!(n1 > 0) || !(n2 > 0)) return NaN;
        const p1 = s1 / n1, p2 = s2 / n2;
        const pPool = (s1 + s2) / (n1 + n2);
        const denom = pPool * (1 - pPool) * (1/n1 + 1/n2);
        if (!(denom > 0)) return NaN;     // equal-zero or equal-one proportions
        const z = (p1 - p2) / Math.sqrt(denom);
        return 2 * (1 - J.normal.cdf(Math.abs(z), 0, 1));
      },

      // ===== Calculus (numeric — exprStr is math.js syntax, not LaTeX) =====
      // LaTeX→math.js preprocessor in latexToExpr() converts \sum/\prod/\int/\lim/\frac{d}{dx}
      // into calls to these. Body strings come in already lowered to math.js syntax.
      derivativeOf(exprStr, varName) {
        // Returns the symbolic derivative as a math.js expression string.
        // The calculator displays this string via KaTeX in the result chip.
        return math.derivative(exprStr, varName).toString();
      },
      sumOver(exprStr, varName, lo, hi) {
        const node = math.parse(exprStr);
        let total = 0;
        for (let i = lo; i <= hi; i++) total += node.evaluate({ [varName]: i });
        return total;
      },
      prodOver(exprStr, varName, lo, hi) {
        const node = math.parse(exprStr);
        let total = 1;
        for (let i = lo; i <= hi; i++) total *= node.evaluate({ [varName]: i });
        return total;
      },
      integrateNumeric(exprStr, varName, lo, hi) {
        // Composite Simpson's rule, n=1000 intervals.
        // Early-bail to NaN if any sample is non-finite (singularity in domain).
        const node = math.parse(exprStr);
        const f = x => node.evaluate({ [varName]: x });
        const n = 1000, h = (hi - lo) / n;
        const fa = f(lo), fb = f(hi);
        if (!Number.isFinite(fa) || !Number.isFinite(fb)) return NaN;
        let total = fa + fb;
        for (let i = 1; i < n; i++) {
          const fx = f(lo + i * h);
          if (!Number.isFinite(fx)) return NaN;
          total += (i % 2 ? 4 : 2) * fx;
        }
        return (h / 3) * total;
      },
      limitOf(exprStr, varName, a) {
        // Compare left and right neighborhoods. If they diverge significantly
        // OR one is non-finite, the limit doesn't exist → NaN ("undefined").
        // Otherwise return the average (handles removable discontinuities).
        const node = math.parse(exprStr);
        const eps = 1e-7;
        let lt, rt;
        try { lt = node.evaluate({ [varName]: a - eps }); } catch (e) { lt = NaN; }
        try { rt = node.evaluate({ [varName]: a + eps }); } catch (e) { rt = NaN; }
        const lFin = Number.isFinite(lt), rFin = Number.isFinite(rt);
        if (!lFin && !rFin) return NaN;
        if (!lFin || !rFin) return NaN;     // one side blows up → undefined
        const scale = Math.max(1, Math.abs(lt), Math.abs(rt));
        if (Math.abs(lt - rt) > 1 * scale) return NaN;  // discontinuous jump → undefined
        return (lt + rt) / 2;
      }
    // Use override:true because some of our custom names (sort, range, reverse,
    // unique, length) shadow math.js built-ins. Our calculator's keypad always
    // passes varargs, not arrays — the override is by design.
    }, { override: true });
  })();

  // Render KaTeX labels on math-symbol buttons
  // Human-readable speech labels for math-symbol keys whose visible content
  // is rendered via KaTeX and would otherwise be unspoken by screen readers.
  // Keys are the raw data-latex-tex / data-label-tex strings on the button.
  const SYMBOL_LABELS = {
    'a^2':                          'squared',
    'a^b':                          'raised to a power',
    '|a|':                          'absolute value',
    '\\div':                        'divided by',
    '\\times':                      'times',
    '\\cdot':                       'times',
    '\\%':                          'percent',
    '\\frac{a}{b}':                 'fraction',
    '\\sqrt{\\phantom{x}}':         'square root',
    '\\sqrt[n]{\\phantom{x}}':      'nth root',
    '\\pi':                         'pi',
    '\\le':                         'less than or equal to',
    '\\ge':                         'greater than or equal to',
    '+':                            'plus',
    '-':                            'minus',
    'e^x':                          'e to the x',
    '\\sin^{-1}':                   'inverse sine',
    '\\cos^{-1}':                   'inverse cosine',
    '\\tan^{-1}':                   'inverse tangent',
    '\\csc^{-1}':                   'inverse cosecant',
    '\\sec^{-1}':                   'inverse secant',
    '\\cot^{-1}':                   'inverse cotangent',
    '\\sin':                        'sine',
    '\\cos':                        'cosine',
    '\\tan':                        'tangent',
    '\\csc':                        'cosecant',
    '\\sec':                        'secant',
    '\\cot':                        'cotangent',
    'f(x)':                         'functions'
  };

  function renderButtonLabels() {
    document.querySelectorAll('[data-latex-tex], [data-label-tex]').forEach(el => {
      const tex = el.getAttribute('data-latex-tex') || el.getAttribute('data-label-tex');
      try {
        el.innerHTML = katex.renderToString(tex, { throwOnError: false, displayMode: false });
      } catch (e) { el.textContent = tex; }
      // Provide a spoken accessible name when the visible label is pure math.
      if (!el.hasAttribute('aria-label')) {
        const label = SYMBOL_LABELS[tex];
        if (label) el.setAttribute('aria-label', label);
      }
    });
    // Mark every decorative <svg> inside a button as hidden from AT, so the
    // button's title/aria-label is what's announced (not the raw SVG node).
    document.querySelectorAll('button svg, [role="button"] svg').forEach(svg => {
      if (!svg.hasAttribute('aria-hidden')) svg.setAttribute('aria-hidden', 'true');
    });
  }

  function renderTex(target, tex) {
    try {
      katex.render(tex, target, { throwOnError: false, displayMode: false });
    } catch (e) {
      target.textContent = tex;
    }
  }

  // Material Icons (filled): error (solid circle + !) and warning (triangle + !).
  // Inlined as SVG so we don't add a font dependency.
  const STATUS_ICONS = {
    error: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>',

  // Map our internal status tokens to a Formative chip.
  // The label is sentence-case; the icon and color come from the chip CSS class.
  const STATUS_CONFIG = {
    undefined: { kind: 'error',   label: 'Undefined' },
    error:     { kind: 'error',   label: 'Invalid expression' },
    overflow:  { kind: 'warning', label: 'Too large to display' }
  };
  function buildStatusChip(resultLatex) {
    const m = /^\\text\{(\w+)\}$/.exec(resultLatex);
    if (!m) return null;
    const cfg = STATUS_CONFIG[m[1]];
    if (!cfg) return null;
    const chip = document.createElement('span');
    chip.className = `status-chip ${cfg.kind}`;
    chip.setAttribute('role', cfg.kind === 'error' ? 'alert' : 'status');
    chip.dataset.status = m[1];
    chip.innerHTML = STATUS_ICONS[cfg.kind] + `<span>${cfg.label}</span>`;
    return chip;
  }

  // --- Keypad collapse/expand handles ---
  function wireKeypadToggles() {
    document.querySelectorAll('.keypad-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const keypad = btn.closest('.keypad, .graph-keypad');
        if (!keypad) return;
        const collapsing = !keypad.classList.contains('collapsed');
        // If focus is on a key that's about to be hidden, move it to the
        // toggle so keyboard users don't lose their place to <body>.
        if (collapsing && document.activeElement &&
            keypad.contains(document.activeElement) && document.activeElement !== btn) {
          btn.focus();
        }
        keypad.classList.toggle('collapsed', collapsing);
        btn.setAttribute('aria-expanded', String(!collapsing));
        btn.setAttribute('aria-label', collapsing ? 'Expand keypad' : 'Collapse keypad');
        btn.title = collapsing ? 'Expand keypad' : 'Collapse keypad';
        // Re-render graph on toggle so function-plot picks up the new viewport
        if (keypad.classList.contains('graph-keypad')) {
          requestAnimationFrame(() => renderGraph());
        }
      });
    });
  }

  // --- Top-level view switching (Scientific / Graphing) ---
  function wireTopTabs() {
    document.querySelectorAll('.top-tab').forEach(t => {
      t.addEventListener('click', () => {
        const target = t.dataset.view;
        closeTransientPanels();
        document.querySelectorAll('.top-tab').forEach(x => {
          const active = x === t;
          x.classList.toggle('active', active);
          x.setAttribute('aria-selected', String(active));
        });
        document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === `view-${target}`));

          // Re-render graph once visible so it picks up correct dimensions
          renderGraph();
          // Focus the first expression math-field so physical keyboard input
          // works without an extra click. Defer past the renderGraph DOM
          // replace + browser focus settling.
          requestAnimationFrame(() => {
            const firstMf = document.querySelector('#view-graphing .expr-row math-field');
            if (firstMf && typeof firstMf.focus === 'function') firstMf.focus();
