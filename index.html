  // Show the input toggle when the current math-field value is convertible
  // between fraction and decimal forms. Hides it otherwise (integers,
  // irrationals, or expressions that fail to evaluate).
  function updateInputFracToggle() {
    const btn = document.getElementById('input-frac-toggle');
    if (!btn) return;
    const latex = (mf.value || '').trim();
    if (!latex || /\\placeholder(?!\s*\{[^{}]+\})/.test(latex)) { btn.hidden = true; return; }
    let v;
    try {
      const expr = latexToExpr(latex);
      if (!expr) { btn.hidden = true; return; }
      v = math.evaluate(expr);
    } catch (_) { btn.hidden = true; return; }
    if (typeof v !== 'number' || !Number.isFinite(v) || Number.isInteger(v)) { btn.hidden = true; return; }
    let fr;
    try { fr = math.fraction(v); } catch (_) { btn.hidden = true; return; }
    const d = Number(fr.d);
    if (!(d > 1 && d <= 1000)) { btn.hidden = true; return; }
    // Decide direction: if the LaTeX already looks like a single \frac{...}{...},
    // the toggle converts to decimal. Otherwise it converts to fraction.
    const isFracForm = /^\s*-?\s*\\frac\s*\{[^{}]+\}\s*\{[^{}]+\}\s*$/.test(latex);
    btn.hidden = false;
    btn.dataset.mode = isFracForm ? 'to-decimal' : 'to-fraction';
    btn.dataset.value = String(v);
    btn.setAttribute('aria-label', isFracForm ? 'Convert to decimal' : 'Convert to fraction');
    btn.title = isFracForm ? 'Convert to decimal' : 'Convert to fraction';
    btn.innerHTML = isFracForm
      ? '<span aria-hidden="true">#.#</span>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><text x="9" y="10" font-size="10" font-style="italic" font-family="serif" fill="currentColor">a</text><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="9" y="22" font-size="10" font-style="italic" font-family="serif" fill="currentColor">b</text></svg>';
  }

  function onInputFracToggleClick() {
    const btn = document.getElementById('input-frac-toggle');
    if (!btn || btn.hidden) return;
    const v = parseFloat(btn.dataset.value);
    if (!Number.isFinite(v)) return;
    if (btn.dataset.mode === 'to-decimal') {
      const r = Math.abs(v) < 1e-12 ? 0 : parseFloat(v.toPrecision(12));
      mf.value = String(r);
    } else {
      const fr = math.fraction(v);
      const n = Number(fr.n), d = Number(fr.d);
      mf.value = (fr.s < 0 ? '-' : '') + `\\frac{${n}}{${d}}`;
    }
    updateInputFracToggle();
    mf.focus();
  }

  // --- LaTeX -> math.js expression ---
  function latexToExpr(latex) {
    if (!latex) return '';
    let s = latex;
    s = s.replace(/\\left/g, '').replace(/\\right/g, '');

    // ===== Calculus preprocessing =====
    // Convert LaTeX-style calculus operators into calls to the helper
    // functions registered on math.js (derivativeOf, sumOver, prodOver,
    // integrateNumeric, limitOf). Must run before the iterative \frac/\sqrt
    // converter below — otherwise \frac{d}{dx} gets mangled to (d)/(dx).
    //
    // All bodies are required to be parenthesized (the templates do this).
    // The body LaTeX is recursively re-converted to math.js syntax, then
    // embedded as a quoted string argument so the helper can math.parse it.
    function balancedParenBody(s, openIdx) {
      // Given a string and an index of '(', return the matching ')' index, or -1.
      let depth = 0;
      for (let i = openIdx; i < s.length; i++) {
        if (s[i] === '(') depth++;
        else if (s[i] === ')') { depth--; if (depth === 0) return i; }
      }
      return -1;
    }
    function calcBody(latexBody) {
      // Nested calculus operators aren't supported: my custom math.js functions
      // can't pass the outer scope (e.g. \sum's `i`) down into the inner body
      // evaluation. Detect and bail; the caller emits NaN → "undefined" chip.
      // No word boundary after \sum etc. because the next char `_` is itself a
      // word character, so \b would never match.
      if (/\\sum|\\prod|\\int|\\lim|\\frac\s*\{\s*d\s*\}/.test(latexBody)) {
        return null;
      }
      const expr = latexToExpr(latexBody);
      return JSON.stringify(expr);
    }
    function bailIfNested(body) { return calcBody(body); }
    function convertCalcPattern(input, headerRe, makeCall) {
      // headerRe must match the header (e.g. "\\sum_{i=1}^{10}") and have a '('
      // right after the match. Loop because there may be several in one expr.
      let out = input, m;
      while ((m = headerRe.exec(out)) !== null) {
        const headerEnd = m.index + m[0].length;
        if (out[headerEnd] !== '(') break;
        const closeIdx = balancedParenBody(out, headerEnd);
        if (closeIdx < 0) break;
        const body = out.slice(headerEnd + 1, closeIdx);
        const replacement = makeCall(m, body);
        out = out.slice(0, m.index) + replacement + out.slice(closeIdx + 1);
        headerRe.lastIndex = 0;
      }
      return out;
    }

    // \frac{d}{dx}(body) → derivativeOf("body", "x")
    s = convertCalcPattern(s,
      /\\frac\s*\{\s*d\s*\}\s*\{\s*d([a-z])\s*\}\s*/g,
      (m, body) => { const b = calcBody(body); return b ? `derivativeOf(${b},"${m[1]}")` : 'NaN'; });

    // \sum_{var=lo}^{hi}(body)
    s = convertCalcPattern(s,
      /\\sum\s*_\{\s*([a-z])\s*=\s*([^}]+)\}\s*\^\{([^}]+)\}\s*/g,
      (m, body) => { const b = calcBody(body); return b ? `sumOver(${b},"${m[1]}",${latexToExpr(m[2])},${latexToExpr(m[3])})` : 'NaN'; });

    // \prod_{var=lo}^{hi}(body)
    s = convertCalcPattern(s,
      /\\prod\s*_\{\s*([a-z])\s*=\s*([^}]+)\}\s*\^\{([^}]+)\}\s*/g,
      (m, body) => { const b = calcBody(body); return b ? `prodOver(${b},"${m[1]}",${latexToExpr(m[2])},${latexToExpr(m[3])})` : 'NaN'; });

    // \int_{lo}^{hi}(body) dx  — body in parens, then optional "\, dx" trailer.
    // Default the integration variable to "x"; if a trailing "\, d<letter>" follows
    // the integrateNumeric() call, rewrite the variable to match.
    s = convertCalcPattern(s,
      /\\int\s*_\{([^}]+)\}\s*\^\{([^}]+)\}\s*/g,
      (m, body) => { const b = calcBody(body); return b ? `integrateNumeric(${b},"x",${latexToExpr(m[1])},${latexToExpr(m[2])})` : 'NaN'; });
    // Walk each integrateNumeric( call, find its *balanced* closing paren, and
    // strip any "\, d<letter>" that follows. Plain regex can't do this because
    // the body string contains literal parens (e.g. "x^(2)").
    (function stripIntegrationDifferentials() {
      const re = /\bintegrateNumeric\s*\(/g;
      let m;
      while ((m = re.exec(s)) !== null) {
        const openIdx = m.index + m[0].length - 1;
        const closeIdx = balancedParenBody(s, openIdx);
        if (closeIdx < 0) break;
        const after = s.slice(closeIdx + 1);
        const dxMatch = after.match(/^\s*\\?,?\s*d([a-z])/);
        if (dxMatch) {
          // If the differential variable differs from "x", rewrite the var arg.
          const v = dxMatch[1];
          if (v !== 'x') {
            const call = s.slice(m.index, closeIdx + 1).replace(/,"x",/, `,"${v}",`);
            s = s.slice(0, m.index) + call + after.slice(dxMatch[0].length);
          } else {
            s = s.slice(0, closeIdx + 1) + after.slice(dxMatch[0].length);
          }
          re.lastIndex = 0;
        }
      }
    })();

    // \lim_{var\to a}(body)
    s = convertCalcPattern(s,
      /\\lim\s*_\{\s*([a-z])\s*\\to\s*([^}]+)\}\s*/g,
      (m, body) => { const b = calcBody(body); return b ? `limitOf(${b},"${m[1]}",${latexToExpr(m[2])})` : 'NaN'; });

    // Iteratively convert all brace-using constructs (sqrt, frac, exponent).
    // Each pass replaces the innermost (no internal braces); the next pass sees
    // the outer level with its inner braces resolved. Handles arbitrary nesting
    // like \frac{1+\sqrt{5}}{2}, \frac{\frac{1}{2}}{3}, etc.
    // MathLive omits braces around single-token args (e.g. \frac93, \sqrt9);
    // each pattern below accepts {...} OR a single non-brace token.
    let prev;
    let safety = 50;
    do {
      prev = s;
      // n-th root before plain root
      s = s.replace(/\\sqrt\s*\[([^\[\]{}]*)\]\s*(?:\{([^{}]*)\}|([^\s{}\\]))/g,
        (_, n, x1, x2) => `nthRoot((${x1 ?? x2}),(${n}))`);
      s = s.replace(/\\sqrt\s*(?:\{([^{}]*)\}|([^\s{}\\]))/g,
        (_, a, b) => `sqrt((${a ?? b}))`);
      s = s.replace(/\\frac\s*(?:\{([^{}]*)\}|([^\s{}\\]))\s*(?:\{([^{}]*)\}|([^\s{}\\]))/g,
        (_, n1, n2, d1, d2) => `((${n1 ?? n2})/(${d1 ?? d2}))`);
      s = s.replace(/\^\s*\{([^{}]*)\}/g, '^($1)');
    } while (s !== prev && safety-- > 0);
    // abs
    s = s.replace(/\|([^|]+)\|/g, 'abs($1)');
    // operators
    s = s.replace(/\\cdot/g, '*')
         .replace(/\\times/g, '*')
         .replace(/\\div/g, '/')
         .replace(/\\pi/g, 'pi')
         .replace(/\\%/g, '/100')
         .replace(/\\,/g, '');
    // \arcsin/\arccos/\arctan -> asin/acos/atan (math.js naming)
    s = s.replace(/\\arc(sin|cos|tan)/g, 'a$1');
    // log -> log10 (math.js uses log() = ln); we want log to mean base-10
    s = s.replace(/\\log/g, 'log10');
    // ln -> log (math.js natural log is `log` with one arg)
    s = s.replace(/\\ln/g, 'log');
    // exp keeps its name
    // standard LaTeX trig / hyperbolic / exp commands → bare math.js names.
    // Longer names first so e.g. \sinh isn't consumed by \sin.
    s = s.replace(/\\(arcsin|arccos|arctan|sinh|cosh|tanh|asin|acos|atan|sin|cos|tan|csc|sec|cot|exp|min|max|gcd|mod|abs)/g, '$1');
    // \arcsin etc. (above) - normalize to math.js style "asin"
    s = s.replace(/\barc(sin|cos|tan|csc|sec|cot)\b/g, 'a$1');
    // \operatorname{name} -> name (handles mean, stdev, stdevp, nPr, nCr, abs, round, etc.)
    s = s.replace(/\\operatorname\s*\{([^{}]+)\}/g, '$1');
    // map calculator function names to math.js equivalents
    s = s.replace(/\bstdevp\b/g, 'std');  // prototype: maps to sample stdev
    s = s.replace(/\bstdev\b/g, 'std');
    s = s.replace(/\bnPr\b/g, 'permutations');
    s = s.replace(/\bnCr\b/g, 'combinations');
    s = s.replace(/\bvar\b/g, 'variance');
    // strip remaining latex braces / commands
    s = s.replace(/[{}]/g, '');
    return s.trim();
  }

  function evaluate() {
    const latex = (mf.value || '').trim();
    if (!latex) return;
    // Refuse to submit when the input contains unfilled placeholders
    // (e.g. user clicked sin( ) but never typed the argument).
    // Move focus to the placeholder so the user knows what to fill in.
    if (/\\placeholder(?!\s*\{[^{}]+\})/.test(latex)) {
      mf.executeCommand('moveToNextPlaceholder');
      return;
    }
    const expr = latexToExpr(latex);
    let resultLatex;
    let fractionLatex = null;
    try {
      const evalExpr = expr;
      // DEG mode: override trig and inverse-trig in math.js's scope so that
      // sin/cos/tan/csc/sec/cot take degrees, and asin/.../acot return degrees.
      // Scope-based avoids fragile regex surgery on nested expressions like
      // \arctan(\sqrt{3}) → atan(sqrt((3))) with deep parens.
      const D2R = Math.PI / 180, R2D = 180 / Math.PI;
      const scope = angleMode === 'deg'
        ? {
            sin:  x => Math.sin(x * D2R),
            cos:  x => Math.cos(x * D2R),
            tan:  x => Math.tan(x * D2R),
            csc:  x => 1 / Math.sin(x * D2R),
            sec:  x => 1 / Math.cos(x * D2R),
            cot:  x => 1 / Math.tan(x * D2R),
            asin: x => Math.asin(x) * R2D,
            acos: x => Math.acos(x) * R2D,
            atan: x => Math.atan(x) * R2D,
            acsc: x => Math.asin(1 / x) * R2D,
            asec: x => Math.acos(1 / x) * R2D,
            acot: x => Math.atan(1 / x) * R2D
          }
        : undefined;
      let v = scope ? math.parse(evalExpr).evaluate(scope) : math.evaluate(evalExpr);
      // Coerce booleans (e.g. isPrime returns true/false) to 1/0 for display
      if (typeof v === 'boolean') v = v ? 1 : 0;
      // Real-mode "undefined" cases:
      //   • Complex results from √(-x), ln(-x), arcsin(|x|>1), etc.
      //   • Non-finite (Infinity / NaN) from 9/0, 0/0, log(0), 2^1024, etc.
      //   • tan/cot near a singularity — float rounding turns Infinity into a
      //     finite-but-huge number (tan(90°) ≈ 1.6e16). Snap huge magnitudes
      //     to undefined only when the expression actually uses tan/cot, so
      //     legitimate large-number arithmetic still works.
      // Functions that have real-domain singularities. Used both for
      // huge-but-finite detection (float rounds Infinity → ~1e16) and for
      // distinguishing "undefined" (singularity) from "overflow" (just too big).
      const SINGULARITY_FN_RE = /\b(tan|cot|csc|sec|atanh|acoth|asech|acsch)\s*\(/;

      const isComplexResult = math.isComplex && math.isComplex(v);
      const hasSingularityFn = SINGULARITY_FN_RE.test(evalExpr);
      const isHugeFromTrig = typeof v === 'number' && hasSingularityFn && Math.abs(v) > 1e10;
      const isNonFiniteNumber = typeof v === 'number' && !Number.isFinite(v);
      if (isComplexResult || isHugeFromTrig || isNonFiniteNumber) {
        // Distinguish "undefined" (singularity) from "overflow" (number too big).
        let reason = 'undefined';
        if (isNonFiniteNumber && !isComplexResult && !isHugeFromTrig) {
          const isDivByZero = /\/\s*\(?\s*0\b(?!\.)/.test(evalExpr);
          const isLogOfZero = /\b(?:log|log10)\s*\(\s*0\s*[,)]/.test(evalExpr);
          if (!Number.isNaN(v) && !isDivByZero && !isLogOfZero && !hasSingularityFn) reason = 'overflow';
        }
        resultLatex = `\\text{${reason}}`;
        lastAnswer = null;
      } else if (typeof v === 'number') {
        // Round to 12 sig figs via toPrecision (works for any magnitude;
        // the previous Math.round(v * 1e12) form overflowed for v >= 1e296).
        const r = Math.abs(v) < 1e-12 ? 0 : parseFloat(v.toPrecision(12));
        resultLatex = String(r);
        lastAnswer = v;
        // Pre-compute the fraction representation when it's clean (small
        // denominator) and not already an integer. Used by the toggle button.
        try {
          if (Number.isFinite(r) && !Number.isInteger(r)) {
            const fr = math.fraction(r);
            const d = Number(fr.d), n = Number(fr.n);
            if (d > 1 && d <= 1000 && Math.abs(n) < 1e15) {
              fractionLatex = (fr.s < 0 ? '-' : '') + `\\frac{${n}}{${d}}`;
            }
          }
        } catch (_) { /* not representable as a clean fraction */ }
      } else if (typeof v === 'string') {
        // Symbolic results (e.g. derivativeOf returns a math.js expression string).
        // Pass through directly — math.format would wrap it in quotes.
        resultLatex = v;
        lastAnswer = v;
      } else {
        resultLatex = math.format(v, { precision: 12 });
        lastAnswer = v;
      }
    } catch (err) {
      resultLatex = '\\text{error}';
    }
    entries.push({ exprLatex: latex, resultLatex, fractionLatex, displayMode: 'decimal' });
    mf.value = '';
    updateInputFracToggle();
    renderHistory();
  }

  function updateClearAllVisibility() {
    const hasInput = (mf && (mf.value || '').length > 0);
    const hasHistory = entries.length > 0;
    document.getElementById('clear-all').style.visibility = (hasInput || hasHistory) ? 'visible' : 'hidden';
  }

  // Postfix operators (a², a^b, !) need an operand to act on.
  // Disable when:
  //   • the input is empty, OR
  //   • there's an unfilled placeholder anywhere (cursor is most likely
  //     parked in it, and applying a postfix would nest malformed LaTeX
  //     like \placeholder{}^2 → ^{^2}).
  function updateOperandRequiredKeys() {
    const v = (mf && mf.value) || '';
    const hasUnfilledPlaceholder = /\\placeholder\s*\{\s*\}/.test(v);
    const hasOperand = v.length > 0 && !hasUnfilledPlaceholder;
    document.querySelectorAll('[data-needs-operand]').forEach(k => {
      k.classList.toggle('is-disabled', !hasOperand);
      if (!hasOperand) k.setAttribute('aria-disabled', 'true');
      else k.removeAttribute('aria-disabled');
    });
  }

  const TEST_MODE = new URLSearchParams(location.search).get('testharness') === '1';

  function renderHistory() {
    const el = document.getElementById('history');
    el.innerHTML = '';
    updateClearAllVisibility();
    updateOperandRequiredKeys();
    // In test mode we only render the last entry to avoid O(N²) KaTeX re-renders
    // across long test suites. The runner only reads the most recent result anyway.
    const renderList = TEST_MODE ? entries.slice(-1) : entries;
    if (entries.length === 0) {
      const blank = document.createElement('div');
      blank.className = 'row blank-row';
      el.appendChild(blank);
      return;
    }
    renderList.forEach((e) => {
      const row = document.createElement('article');
      row.className = 'row';
      const left = document.createElement('span');
      left.className = 'expr';
      renderTex(left, e.exprLatex);
      const right = document.createElement('span');
      right.className = 'res';
      const resSpan = document.createElement('span');
      const statusChip = buildStatusChip(e.resultLatex);
      if (statusChip) {
        resSpan.appendChild(statusChip);
      } else {
        // SR-only "equals" so the live region announces "<expr> equals <result>"
        // instead of the visual "= 4" (which screen readers may not speak).
        const eq = document.createElement('span');
        eq.className = 'sr-only';
        eq.textContent = ' equals ';
        resSpan.appendChild(eq);
        const visible = document.createElement('span');
        visible.setAttribute('aria-hidden', 'true');
        const shown = (e.displayMode === 'fraction' && e.fractionLatex) ? e.fractionLatex : e.resultLatex;
        renderTex(visible, `= ${shown}`);
        resSpan.appendChild(visible);
        const spoken = document.createElement('span');
        spoken.className = 'sr-only';
        spoken.textContent = latexToSpeech(shown);
        resSpan.appendChild(spoken);
        // Square toggle button: only when a clean fraction representation exists
        if (e.fractionLatex) {
          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'frac-toggle';
          const isFraction = e.displayMode === 'fraction';
          toggle.setAttribute('aria-label', isFraction ? 'Convert to decimal' : 'Convert to fraction');
          toggle.title = isFraction ? 'Convert to decimal' : 'Convert to fraction';
          toggle.innerHTML = isFraction
            // Text "#.#" indicates "convert to decimal"
            ? '<span aria-hidden="true">#.#</span>'
            // Fraction icon a/b stacked with a bar indicates "convert to fraction"
            : '<svg viewBox="0 0 24 24" aria-hidden="true"><text x="9" y="10" font-size="10" font-style="italic" font-family="serif" fill="currentColor">a</text><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="9" y="22" font-size="10" font-style="italic" font-family="serif" fill="currentColor">b</text></svg>';
          toggle.addEventListener('click', () => {
            e.displayMode = isFraction ? 'decimal' : 'fraction';
            renderHistory();
          });
          resSpan.appendChild(toggle);
        }
      }
      right.appendChild(resSpan);
      row.appendChild(left);
      row.appendChild(right);
      el.appendChild(row);
    });
    el.scrollTop = el.scrollHeight;
  }

  // Read the build-time placeholder injected at deploy. If it's still the
  // literal placeholder string, we're running a local dev build — hide the
  // chip. Otherwise format the ISO timestamp as a human-readable string.
  (function showBuildTime() {
    const raw = window.__BUILD_TIME__;
    const el = document.getElementById('build-time');
    if (!el) return;
    const chip = el.closest('.last-updated');
    if (!raw || raw === '@@' + 'BUILD_TIME@@') { if (chip) chip.hidden = true; return; }
    const d = new Date(raw);
    if (isNaN(d.getTime())) { if (chip) chip.hidden = true; return; }
    el.textContent = d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
    el.setAttribute('datetime', raw);
    if (chip) chip.hidden = false;
  })();

  // Wait for the math-field custom element to be defined before init,
  // otherwise mf.executeCommand and value setter are unavailable.
  function ready() {
    if (window.customElements && customElements.get('math-field')) {
      init();
    } else if (window.customElements) {
      customElements.whenDefined('math-field').then(init);
    } else {
      setTimeout(ready, 50);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ready);
  } else {
    ready();
  }
})();
</script>
</body>
</html>
