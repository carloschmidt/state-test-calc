  function buildFunctionPanel() {
    const body = document.getElementById('fn-panel-body');
    if (!body) return;
    const frag = document.createDocumentFragment();
    FN_LIBRARY.forEach(section => {
      const sec = document.createElement('section');
      sec.className = 'fn-section';
      const h = document.createElement('h4');
      h.textContent = section.title;
      sec.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'fn-grid';
      section.items.forEach(it => {
        const btn = document.createElement('button');
        const wired = it.wired !== false;
        btn.className = 'fn-btn' + (wired ? '' : ' unwired');
        btn.dataset.insert = it.insert;
        btn.dataset.wired = String(wired);
        let labelHtml = '';
        try { labelHtml = katex.renderToString(it.tex, { throwOnError: false, displayMode: false }); }
        catch (e) { labelHtml = it.tex; }
        if (!wired) {
          btn.disabled = true;
          btn.title = 'Not yet implemented — coming in v2';
          btn.setAttribute('aria-disabled', 'true');
          btn.innerHTML = labelHtml + '<span class="fn-badge">Soon</span>';
        } else {
          btn.innerHTML = labelHtml;
        }
        btn.addEventListener('mousedown', (e) => e.preventDefault());
        btn.addEventListener('click', () => {
          if (!wired) return; // No-op for not-yet-implemented entries
          insertFromLibrary(it.insert);
        });
        grid.appendChild(btn);
      });
      sec.appendChild(grid);
      frag.appendChild(sec);
    });
    body.innerHTML = '';
    body.appendChild(frag);

    // Open/close wiring
    const panel = document.getElementById('fn-panel');
    document.getElementById('fn-panel-close').addEventListener('click', () => toggleFnPanel(false));
    document.addEventListener('click', (e) => {
      if (!panel.classList.contains('open')) return;
      if (panel.contains(e.target)) return;
      // Don't close when clicking the f(x) trigger (its handler will toggle)
      if (e.target.closest('[data-cmd="functions"]')) return;
      toggleFnPanel(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && panel.classList.contains('open')) toggleFnPanel(false);
    });
  }

  let fnPanelOpener = null;
  function toggleFnPanel(force) {
    const panel = document.getElementById('fn-panel');
    const wasOpen = panel.classList.contains('open');
    const open = typeof force === 'boolean' ? force : !wasOpen;
    if (open === wasOpen) return;
    panel.classList.toggle('open', open);
    panel.setAttribute('aria-hidden', String(!open));
    if (open) {
      // Remember where focus came from so we can restore on close.
      fnPanelOpener = document.activeElement;
      document.getElementById('fn-panel-close')?.focus();
    } else {
      // Restore focus to whatever opened the panel (typically the f(x) key).
      if (fnPanelOpener && typeof fnPanelOpener.focus === 'function' &&
          document.body.contains(fnPanelOpener)) {
        fnPanelOpener.focus();
      }
      fnPanelOpener = null;
    }
  }

  function insertFromLibrary(insert) {
    const mfTarget = graphState.focusedMf || graphState.rows[0]?.mathfield;
    if (!mfTarget) return;
    mfTarget.focus();
    mfTarget.executeCommand(['insert', insert, { selectionMode: 'placeholder' }]);
    toggleFnPanel(false);
  }

  // Track recent placeholder-template insertions per math-field. When the user
  // inserts an operator after filling a template (a^b, frac, sqrt, etc.), we
  // call moveAfterParent first so the operator lands outside the template,
  // matching expectations like "x^2 + 3x" (vs. "x^{2+3x}").
  const _templateActive = new WeakMap();
  function isOperatorInsert(s) {
    return ['+','-','\\times','\\div','\\cdot','=','<','>','\\le','\\ge',','].indexOf(s) >= 0;
  }
  function isTemplateLatex(s) {
    return typeof s === 'string' && /#\?/.test(s);
  }

  function handleGraphKey(k) {
    const mfTarget = graphState.focusedMf || graphState.rows[0]?.mathfield;
    if (!mfTarget) return;
    mfTarget.focus();
    const insert = k.dataset.insert;
    const cmd = k.dataset.cmd;
    const fn = k.dataset.fn;
    const letter = k.dataset.letter;
    const latex = k.dataset.latex;

    // Smart-exit on operator after template
    if (_templateActive.get(mfTarget) && insert !== undefined && isOperatorInsert(insert)) {
      try { mfTarget.executeCommand('moveAfterParent'); } catch (e) {}
      _templateActive.set(mfTarget, false);
    }
    if (letter) {
      mfTarget.executeCommand(['insert', letter]);
    } else if (insert !== undefined) {
      mfTarget.executeCommand(['insert', insert]);
    } else if (latex) {
      mfTarget.executeCommand(['insert', latex, { selectionMode: 'placeholder' }]);
    } else if (fn) {
      mfTarget.executeCommand(['insert', `\\${fn}\\left(#0\\right)`, { selectionMode: 'placeholder' }]);
    } else if (cmd === 'backspace') {
      mfTarget.executeCommand('deleteBackward');
    } else if (cmd === 'left') {
      mfTarget.executeCommand('moveToPreviousChar');
    } else if (cmd === 'right') {
      mfTarget.executeCommand('moveToNextChar');
    } else if (cmd === 'sqrt') {
      mfTarget.executeCommand(['insert', '\\sqrt{#0}', { selectionMode: 'placeholder' }]);
    } else if (cmd === 'abs') {
      mfTarget.executeCommand(['insert', '\\left|#0\\right|', { selectionMode: 'placeholder' }]);
    } else if (cmd === 'enter') {
      addExpressionRow('');
    } else if (cmd === 'functions') {
      toggleFnPanel();
    } else if (cmd === 'abc') {
      document.querySelector('.graph-keypad').dataset.mode = 'alpha';
    } else if (cmd === 'alpha-back') {
      document.querySelector('.graph-keypad').dataset.mode = 'numeric';
    } else if (cmd === 'audio') {
      speakExpression(mfTarget.value || '');
    }

    // Update template-active flag for next keystroke.
    if (isTemplateLatex(latex)) _templateActive.set(mfTarget, true);
    else if (insert !== undefined && isOperatorInsert(insert)) _templateActive.set(mfTarget, false);
    // Digits / letters stay inside the template (user is filling it), so don't touch the flag.
  }

  // Convert LaTeX to a roughly-readable string and use the Web Speech API.
  function speakExpression(latex) {
    if (!('speechSynthesis' in window)) return;
    const phrase = latexToSpeech(latex);
    if (!phrase) return;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(phrase));
  }
  function latexToSpeech(latex) {
    if (!latex) return 'empty';
    let s = latex;
    s = s.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, ' $1 over $2 ');
    s = s.replace(/\\sqrt\s*\{([^{}]*)\}/g, ' square root of $1 ');
    s = s.replace(/\\sqrt\s*\[([^\]]+)\]\s*\{([^{}]*)\}/g, ' $1 root of $2 ');
    s = s.replace(/\\left\|([^|]+)\\right\|/g, ' absolute value of $1 ');
    s = s.replace(/\^\{([^{}]*)\}/g, ' to the power of $1 ');
    s = s.replace(/\^(\w)/g, ' to the power of $1 ');
    s = s.replace(/\\(sin|cos|tan|csc|sec|cot|sinh|cosh|tanh|ln|log|exp|arcsin|arccos|arctan)/g, ' $1 of ');
    s = s.replace(/\\pi/g, ' pi ');
    s = s.replace(/\\cdot|\\times/g, ' times ');
    s = s.replace(/\\div|\//g, ' divided by ');
    s = s.replace(/\\left\(/g, ' ( ').replace(/\\right\)/g, ' ) ');
    s = s.replace(/\\operatorname\{([^}]+)\}/g, ' $1 ');
    s = s.replace(/[{}\\]/g, ' ');
    s = s.replace(/\+/g, ' plus ').replace(/-/g, ' minus ');
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  // Visible swatch is a color square; this lookup gives the same information
  // in words so colorblind / SR users can distinguish expressions (WCAG 1.4.1).
  const COLOR_NAMES = ['red', 'blue', 'green', 'amber', 'purple', 'pink'];

  function addExpressionRow(latex) {
    const id = graphState.nextId++;
    const idx = graphState.rows.length;
    const color = graphState.colors[idx % graphState.colors.length];
    const colorName = COLOR_NAMES[idx % COLOR_NAMES.length];
    const fnNumber = idx + 1;
    const row = document.createElement('div');
    row.className = 'expr-row';
    row.dataset.id = id;
    row.innerHTML = `
      <div class="expr-color" style="background:${color}" aria-label="Function ${fnNumber}, ${colorName}">
        <span class="sr-only">Function ${fnNumber}, ${colorName}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 17q3-10 9-10t9 10"/></svg>
      </div>
      <math-field class="expr-field" aria-label="Expression ${fnNumber}"></math-field>
      <button class="expr-delete" aria-label="Remove expression ${fnNumber}">×</button>
    `;
    const mfEl = row.querySelector('math-field');
    mfEl.mathVirtualKeyboardPolicy = 'manual';
    mfEl.addEventListener('focus', () => { graphState.focusedMf = mfEl; });
    mfEl.addEventListener('input', () => renderGraph());
    row.querySelector('.expr-delete').addEventListener('click', () => {
      graphState.rows = graphState.rows.filter(r => r.id !== id);
      row.remove();
      renderGraph();
    });
    document.getElementById('expr-rows').appendChild(row);
    graphState.rows.push({ id, type: 'expr', mathfield: mfEl, color });
    if (latex) {
      // Wait a tick for custom element to be ready
      setTimeout(() => { mfEl.value = latex; renderGraph(); }, 0);
    }
    mfEl.focus();
  }

  // Exposed for debugging — keep so tests can verify the conversion layer.
  window.__latexToGraphableFn = (l) => latexToGraphableFn(l);
  // Returns a function-plot data entry: { fn, fnType, closed, points, ... } or null.
  // Supports: y = f(x), bare f(x), y > f(x) / y < f(x) / y >= / y <=, and
  // implicit equations like "x^2 + y^2 = 25" (rendered via fnType: implicit).
  function latexToGraphableFn(latex) {
    if (!latex) return null;
    if (/\\placeholder\s*\{\s*\}/.test(latex)) return null;
    const trimmed = latex.trim();
    // ----- Table column tuple: (x_n, y_n) → scatter of paired data points -----
    const colTuple = /^\s*\(\s*([xy])_\{?(\d+)\}?\s*,\s*([xy])_\{?(\d+)\}?\s*\)\s*$/.exec(
      trimmed.replace(/\\left|\\right/g, '')
    );
    if (colTuple) {
      const colA = `${colTuple[1]}_${colTuple[2]}`;
      const colB = `${colTuple[3]}_${colTuple[4]}`;
      const a = getTableColumn(colA), b = getTableColumn(colB);
      if (a && b) {
        const pts = [];
        const n = Math.min(a.length, b.length);
        for (let i = 0; i < n; i++) {
          if (a[i] !== null && b[i] !== null) pts.push([a[i], b[i]]);
        }
        if (pts.length === 0) return null;
        return { fnType: 'points', points: pts, graphType: 'scatter' };
      }
      // Subscripted vars but no matching table → reject
      return null;
    }
    // ----- Coordinate point OR parametric tuple: (expr, expr) -----
    // Static numeric tuple → single dot. Tuple referencing `t` → parametric curve.
    // Use balanced-paren splitting so (cos(t), sin(t)) splits at the OUTER comma.
    const stripped = trimmed.replace(/\\left|\\right/g, '');
    let tupleParts = null;
    if (stripped.startsWith('(') && stripped.endsWith(')')) {
      const inner = stripped.slice(1, -1);
      let depth = 0, commaIdx = -1;
      for (let i = 0; i < inner.length; i++) {
        const ch = inner[i];
        if (ch === '(' || ch === '{' || ch === '[') depth++;
        else if (ch === ')' || ch === '}' || ch === ']') depth--;
        else if (ch === ',' && depth === 0) {
          if (commaIdx >= 0) { commaIdx = -2; break; } // more than one top-level comma → not a tuple
          commaIdx = i;
        }
      }
      if (commaIdx > 0 && depth === 0) tupleParts = [inner.slice(0, commaIdx).trim(), inner.slice(commaIdx + 1).trim()];
    }
    if (tupleParts) {
      const xRaw = latexToExpr(tupleParts[0]);
      const yRaw = latexToExpr(tupleParts[1]);
      if (xRaw && yRaw) {
        let xN, yN;
        try { xN = math.parse(xRaw); yN = math.parse(yRaw); } catch (_) { xN = null; }
        if (xN && yN) {
          const free = new Set([...collectFreeSymbols(xN), ...collectFreeSymbols(yN)]);
          const usesT = free.has('t');
          const extras = [...free].filter(s => s !== 't');
          if (usesT && extras.length === 0) {
            const tSamples = [-1, 0, 1, 2];
            let anyFinite = false;
            for (const tv of tSamples) {
              try {
                const vx = xN.evaluate(new Map([['t', tv]]));
                const vy = yN.evaluate(new Map([['t', tv]]));
                if (Number.isFinite(vx) && Number.isFinite(vy)) anyFinite = true;
              } catch (_) { return null; }
            }
            if (!anyFinite) return null;
            let xExpr = xRaw, yExpr = yRaw;
            if (graphSettings.angle === 'degrees') { xExpr = applyDegMode(xExpr); yExpr = applyDegMode(yExpr); }
            return { fnType: 'parametric', graphType: 'polyline', x: xExpr, y: yExpr, range: [-2 * Math.PI, 2 * Math.PI] };
          }
          if (free.size === 0) {
            try {
              const px = xN.evaluate({}), py = yN.evaluate({});
              if (Number.isFinite(px) && Number.isFinite(py)) {
                return { points: [[px, py]], fnType: 'points', graphType: 'scatter' };
              }
            } catch (_) { /* fall through */ }
          }
          if (extras.length > 0) return null;
        }
      }
    }
    // ----- Polygon: polygon((x1,y1),(x2,y2),...) — connected polyline, auto-closed -----
    const polyMatch = /^\s*polygon\s*\((.*)\)\s*$/i.exec(stripped);
    if (polyMatch) {
      const body = polyMatch[1];
      const ptRegex = /\(\s*([-+]?[\d.]+(?:e[-+]?\d+)?)\s*,\s*([-+]?[\d.]+(?:e[-+]?\d+)?)\s*\)/g;
      const pts = [];
      let m;
      while ((m = ptRegex.exec(body)) !== null) {
        const px = parseFloat(m[1]), py = parseFloat(m[2]);
        if (!Number.isFinite(px) || !Number.isFinite(py)) return null;
        pts.push([px, py]);
      }
      if (pts.length < 2) return null;
      // Reject if anything besides commas/whitespace remains
      const cleaned = body.replace(ptRegex, '').replace(/[\s,]/g, '');
      if (cleaned.length > 0) return null;
      const closed = [...pts, pts[0]];
      return { fnType: 'points', points: closed, graphType: 'polyline' };
    }
    // ----- Inequality: `y op expr` OR `expr op y` (op ∈ <, >, ≤, ≥) -----
    // Normalize y to the LEFT side so we always plot `y op expr`. If the user
    // wrote `expr op y` (e.g. "x >= y"), swap sides and flip the operator.
    const normalizeOp = raw => raw.replace(/\\le\b/g, '<=').replace(/\\ge\b/g, '>=').replace(/\\leq\b/g, '<=').replace(/\\geq\b/g, '>=');
    const flipOp = op => ({ '<': '>', '>': '<', '<=': '>=', '>=': '<=' }[op]);
    const ineqAny = /^\s*(.+?)\s*(<=|>=|\\le|\\ge|\\leq|\\geq|<|>)\s*(.+?)\s*$/i.exec(trimmed);
    if (ineqAny) {
      const rawOp = normalizeOp(ineqAny[2]);
      let exprSide, op;
      if (/^\s*y\s*$/i.test(ineqAny[1])) { exprSide = ineqAny[3]; op = rawOp; }
      else if (/^\s*y\s*$/i.test(ineqAny[3])) { exprSide = ineqAny[1]; op = flipOp(rawOp); }
      else { exprSide = null; }
      if (exprSide !== null && op) {
        const strict = (op === '<' || op === '>');
        const above = (op === '>' || op === '>=');
        let rhs = latexToExpr(exprSide.trim());
        if (!rhs) return null;
        if (graphSettings.angle === 'degrees') rhs = applyDegMode(rhs);
        let rhsNode;
        try { rhsNode = math.parse(rhs); } catch (e) { return null; }
        // Auto-promote sliders for free symbols (other than x/y)
        rhsNode = autoPromoteAndSubstitute(rhsNode, ['x', 'y']);
        // The boundary line must be on the y vs x grid — `rhs` may not actually
        // reference x (e.g. "y > 5"); function-plot still graphs it as constant.
        rhs = rhsNode.toString();
        return { fn: rhs, closed: true, skipBoundsCheck: false, _inequality: { above, strict } };
      }
      // Vertical inequality: `x op constant` or `constant op x` (x not on both sides)
      let xExpr, vOp;
      if (/^\s*x\s*$/i.test(ineqAny[1])) { xExpr = ineqAny[3]; vOp = rawOp; }
      else if (/^\s*x\s*$/i.test(ineqAny[3])) { xExpr = ineqAny[1]; vOp = flipOp(rawOp); }
      else { xExpr = null; }
      if (xExpr !== null && vOp) {
        let val;
        try {
          const e = latexToExpr(xExpr.trim());
          if (!e) return null;
          const n = math.parse(e);
          // Free symbols must reduce to constants after slider substitution
          const subst = autoPromoteAndSubstitute(n, []);
          val = subst.evaluate({});
        } catch (_) { return null; }
        if (typeof val !== 'number' || !Number.isFinite(val)) return null;
        const strict = (vOp === '<' || vOp === '>');
        const right = (vOp === '>' || vOp === '>=');
        return { _xInequality: { x: val, right, strict } };
      }
    }
    // ----- Implicit equation: anything with both x AND y AND "=" -----
    const eqMatch = /^\s*([^=]+?)\s*=\s*([^=]+?)\s*$/.exec(trimmed);
    if (eqMatch && !/^\s*y\s*=/i.test(trimmed)) {
      // Has '=' but isn't "y = ..." → treat as implicit F(x,y) = 0
      let lhs = latexToExpr(eqMatch[1].trim());
      let rhs = latexToExpr(eqMatch[2].trim());
      if (!lhs || !rhs) return null;
      // math.js doesn't treat letter-letter as implicit multiplication
      // (so "xy" is a single identifier, not x*y). For plot expressions we
      // know only x and y are variables — insert explicit * between adjacent
      // x/y letters so "xy=1", "yx", "yxy" all parse correctly.
      const fixAdjacent = s => {
        let prev;
        do { prev = s; s = s.replace(/([xy])([xy])/g, '$1*$2'); } while (s !== prev);
        return s;
      };
      lhs = fixAdjacent(lhs); rhs = fixAdjacent(rhs);
      let fnExpr = `(${lhs}) - (${rhs})`;
      if (graphSettings.angle === 'degrees') fnExpr = applyDegMode(fnExpr);
      try { math.parse(fnExpr); } catch (e) { return null; }
      // Verify the expression actually references both x and y as variables.
      // Walk the math.js AST — regex can't reliably distinguish `xy` (implicit
      // mult: x*y) from `x` alone, but parsing it does the right thing.
      let parsed;
      try { parsed = math.parse(fnExpr); } catch (e) { return null; }
      const symbols = new Set();
      parsed.traverse(node => {
        if (node.isSymbolNode || node.type === 'SymbolNode') symbols.add(node.name);
      });
      if (!symbols.has('x') || !symbols.has('y')) return null;
      // Auto-promote sliders for any free symbols beyond x/y
      const promoted = autoPromoteAndSubstitute(parsed, ['x', 'y']);
      return { fn: promoted.toString(), fnType: 'implicit' };
    }
    // ----- Derivative graphing: y = \frac{d}{dx}(expr) -----
    const derivHeader = /^\s*y\s*=\s*\\frac\s*\{\s*d\s*\}\s*\{\s*dx\s*\}\s*/i;
    const dhMatch = derivHeader.exec(stripped);
    if (dhMatch) {
      const after = stripped.slice(dhMatch[0].length).trim();
      if (after.startsWith('(')) {
        // Balanced-paren scan
        let depth = 0, end = -1;
        for (let i = 0; i < after.length; i++) {
          if (after[i] === '(') depth++;
          else if (after[i] === ')') { depth--; if (depth === 0) { end = i; break; } }
        }
        if (end === after.length - 1) {
          const bodyLatex = after.slice(1, end);
          const body = latexToExpr(bodyLatex);
          if (!body) return null;
          let bodyParsed;
          try { bodyParsed = math.parse(body); } catch (_) { return null; }
          const bodyFree = collectFreeSymbols(bodyParsed);
          if ([...bodyFree].some(s => s !== 'x')) return null;
          let derivExpr;
          try { derivExpr = math.derivative(body, 'x').toString(); } catch (_) { return null; }
          let parsed;
          try { parsed = math.parse(derivExpr); } catch (_) { return null; }
          const dFree = collectFreeSymbols(parsed);
          if ([...dFree].some(s => s !== 'x')) return null;
          let ds = derivExpr;
          if (graphSettings.angle === 'degrees') ds = applyDegMode(ds);
          return { fn: ds };
        }
      }
    }
    // ----- Piecewise: y = expr \{condition\} -----
    const piece = extractPiecewise(trimmed);
    if (piece) {
      const range = parseRangeCondition(piece[1]);
      if (range) {
        let sp = piece[0].replace(/^\s*y\s*=\s*/i, '');
        sp = latexToExpr(sp);
        if (!sp) return null;
        if (graphSettings.angle === 'degrees') sp = applyDegMode(sp);
        try { math.parse(sp); } catch (_) { return null; }
        return { fn: sp, range };
      }
      // Condition present but unparseable → reject the whole thing
      return null;
    }
    // ----- Standard "y = f(x)" or bare expression -----
    let s = trimmed.replace(/^\s*y\s*=\s*/i, '');
    if (!s) return null;
    s = latexToExpr(s);
    if (!s) return null;
    if (graphSettings.angle === 'degrees') s = applyDegMode(s);
    let node;
    try { node = math.parse(s); } catch (e) { return null; }
    // Auto-promote any free symbols other than `x` into sliders, then
    // substitute their current values. Re-parse the resulting string.
    node = autoPromoteAndSubstitute(node, ['x']);
    s = node.toString();
    try { node = math.parse(s); } catch (e) { return null; }
    // Sanity-evaluate at several x to catch:
    //   • undefined symbols ("y=z+1" → throws on z) → reject
    //   • constant non-finite ("y=1/0", "y=0/0") → no x ever yields a number → reject
    // Asymptotic functions (y=1/x, y=ln(x), y=√x) still pass because at
    // least one sample x produces a finite value.
    const samples = [-2, -1, -0.5, 0.5, 1, 2];
    let anyFinite = false;
    for (const xv of samples) {
      try {
        const v = node.evaluate(new Map([['x', xv]]));
        if (typeof v === 'number' && Number.isFinite(v)) { anyFinite = true; }
      } catch (e) {
        return null;
      }
    }
    if (!anyFinite) return null;
    return { fn: s };
  }

  // Apply DEG-mode trig rewriting (extracted so we can use it across paths).
  function applyDegMode(s) {
    s = s.replace(/\b(asin|acos|atan|acsc|asec|acot)\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)/g,
      (_, fn, arg) => `(${fn}(${arg}) * 180 / pi)`);
    s = s.replace(/(?<!a)\b(sin|cos|tan|csc|sec|cot)\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)/g,
      (_, fn, arg) => `${fn}((${arg}) * pi / 180)`);
    return s;
  }

  // Add a slider row to the UI for `varName`, defaulting to value 1 on [-10, 10].
  // If a slider with this name already exists, this is a no-op.
  function addSliderRow(varName, init) {
    if (graphState.sliders[varName]) return;
    const cfg = init || { value: 1, min: -10, max: 10, step: 0.1 };
    graphState.sliders[varName] = { ...cfg };
    const id = graphState.nextId++;
    const row = document.createElement('div');
    row.className = 'expr-row slider-row';
    row.dataset.id = id;
    // varName may contain underscores (e.g. "k_1"). Render as LaTeX-style subscript.
    const displayName = varName.replace(/_(\w+)/, '<sub>$1</sub>');
    row.innerHTML = `
      <div class="slider-label"><span class="slider-var">${displayName}</span> = <span class="slider-val">${cfg.value}</span></div>
      <input type="range" class="slider-input" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${cfg.value}" aria-label="Slider for ${varName}" />
      <button class="expr-delete" aria-label="Remove slider ${varName}">×</button>
    `;
    const inputEl = row.querySelector('.slider-input');
    const valLabel = row.querySelector('.slider-val');
    inputEl.addEventListener('input', () => {
      const v = parseFloat(inputEl.value);
      graphState.sliders[varName].value = v;
      valLabel.textContent = String(v);
      renderGraph();
    });
    row.querySelector('.expr-delete').addEventListener('click', () => {
      delete graphState.sliders[varName];
      graphState.deletedSliders.add(varName);
      graphState.rows = graphState.rows.filter(r => r.id !== id);
      row.remove();
      renderGraph();
    });
    document.getElementById('expr-rows').appendChild(row);
    graphState.rows.push({ id, type: 'slider', varName });
  }

  // Pick the next unused table subscript (x_1, x_2, ...) so new tables don't collide.
  function nextTableSubscript() {
    let n = 1;
    const taken = new Set();
    for (const r of graphState.rows) {
      if (r.type === 'table') { taken.add(r.xName); taken.add(r.yName); }
    }
    while (taken.has(`x_${n}`)) n++;
    return n;
  }

  // Add a data-table row with editable cells and a CSV-paste shortcut.
  // initialRows is an optional array of [xString, yString] pairs.
  function addTableRow(initialRows) {
    const id = graphState.nextId++;
    const n = nextTableSubscript();
    const tableObj = {
      id, type: 'table',
      xName: `x_${n}`, yName: `y_${n}`,
      rows: initialRows ? initialRows.map(r => [String(r[0]), String(r[1])]) : [['', ''], ['', ''], ['', ''], ['', ''], ['', '']]
    };
    const rowEl = document.createElement('div');
    rowEl.className = 'expr-row table-row';
    rowEl.dataset.id = id;

    const renderBody = () => {
      rowEl.innerHTML = `
        <div class="table-header">
          <span>Table ${n}: <code>${tableObj.xName}</code>, <code>${tableObj.yName}</code></span>
          <span><button class="table-paste" data-paste="1" type="button">Paste CSV</button> · <button class="expr-delete" aria-label="Remove table">×</button></span>
        </div>
        <table>
          <thead><tr><th>${tableObj.xName}</th><th>${tableObj.yName}</th></tr></thead>
          <tbody>
            ${tableObj.rows.map((r, i) => `<tr>
              <td><input data-r="${i}" data-c="0" value="${r[0]}" /></td>
              <td><input data-r="${i}" data-c="1" value="${r[1]}" /></td>
            </tr>`).join('')}
            <tr><td colspan="2" style="text-align:center;"><button class="table-paste" data-add="1" type="button">+ Add row</button></td></tr>
          </tbody>
        </table>
      `;
      rowEl.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          const ri = +inp.dataset.r, ci = +inp.dataset.c;
          tableObj.rows[ri][ci] = inp.value;
          renderGraph();
        });
      });
      rowEl.querySelectorAll('.table-paste').forEach(b => {
        if (b.dataset.add) {
          b.addEventListener('click', () => { tableObj.rows.push(['', '']); renderBody(); renderGraph(); });
        } else if (b.dataset.paste) {
          b.addEventListener('click', async () => {
            try {
              const text = await navigator.clipboard.readText();
              const lines = text.trim().split(/\r?\n/).map(line => line.split(/[,\t]/).map(s => s.trim()));
              if (lines.length && lines.every(r => r.length >= 2)) {
                tableObj.rows = lines.map(r => [r[0], r[1]]);
                renderBody();
                renderGraph();
              }
            } catch (_) { /* clipboard denied */ }
          });
        }
      });
      rowEl.querySelector('.expr-delete').addEventListener('click', () => {
        graphState.rows = graphState.rows.filter(r => r.id !== id);
        rowEl.remove();
        renderGraph();
      });
    };

    renderBody();
    document.getElementById('expr-rows').appendChild(rowEl);
    graphState.rows.push(tableObj);
  }

  // Closed-form least squares for y = m*x + b. Returns {m, b, r2} or null.
  function linearRegression(xs, ys) {
    const n = xs.length;
    if (n < 2) return null;
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (let i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; sxx += xs[i] * xs[i]; sxy += xs[i] * ys[i]; }
    const denom = n * sxx - sx * sx;
    if (denom === 0) return null;
    const m = (n * sxy - sx * sy) / denom;
    const b = (sy - m * sx) / n;
    const meanY = sy / n;
    const ssRes = ys.reduce((acc, y, i) => acc + Math.pow(y - (m * xs[i] + b), 2), 0);
    const ssTot = ys.reduce((acc, y) => acc + Math.pow(y - meanY, 2), 0);
    const r2 = ssTot === 0 ? 1 : 1 - ssRes / ssTot;
    return { m, b, r2 };
  }
  window.__linReg__ = (pairs) => {
    const xs = pairs.map(p => p[0]), ys = pairs.map(p => p[1]);
    const f = linearRegression(xs, ys);
    if (!f) return 'undefined';
    return `m=${+f.m.toFixed(6)},b=${+f.b.toFixed(6)}`;
  };

  // Nelder-Mead nonlinear least squares using fmin. Returns {params, r2, plotFn} or null.
  // model: math.js expression string; paramNames: free parameter names; indep: independent column name.
  function nonlinearRegression(xs, ys, modelExpr, paramNames, indep) {
    if (typeof fmin === 'undefined' || !fmin.nelderMead) return null;
    let node;
    try { node = math.parse(modelExpr); } catch (_) { return null; }
    const compiled = node.compile();
    const loss = paramVec => {
      const scope = {};
      paramNames.forEach((p, i) => { scope[p] = paramVec[i]; });
      let sse = 0;
      for (let i = 0; i < xs.length; i++) {
        scope[indep] = xs[i];
        let pred;
        try { pred = compiled.evaluate(scope); } catch (_) { return 1e30; }
        if (!Number.isFinite(pred)) return 1e30;
        sse += (pred - ys[i]) * (pred - ys[i]);
      }
      return sse;
    };
    const init = paramNames.map(() => 1);
    const result = fmin.nelderMead(loss, init, { maxIterations: 1000 });
    if (!result || !result.x.every(Number.isFinite)) return null;
    const params = {};
    paramNames.forEach((p, i) => { params[p] = result.x[i]; });
    const meanY = ys.reduce((a, b) => a + b, 0) / ys.length;
    let ssRes = 0, ssTot = 0;
    for (let i = 0; i < xs.length; i++) {
      const scope = { ...params, [indep]: xs[i] };
      let pred;
      try { pred = compiled.evaluate(scope); } catch (_) { pred = NaN; }
      if (Number.isFinite(pred)) ssRes += (pred - ys[i]) ** 2;
      ssTot += (ys[i] - meanY) ** 2;
    }
    const r2 = ssTot === 0 ? 1 : 1 - ssRes / ssTot;
    // Substitute fitted params into the expression and rename the independent var to x.
    const subst = node.transform(n => {
      if (n.isSymbolNode && params.hasOwnProperty(n.name)) return new math.ConstantNode(params[n.name]);
      if (n.isSymbolNode && n.name === indep) return new math.SymbolNode('x');
      return n;
    }).toString();
    return { params, r2, plotFn: subst };
  }
  window.__nonlinReg__ = (pairs, model, paramNames) => {
    const xs = pairs.map(p => p[0]), ys = pairs.map(p => p[1]);
    const f = nonlinearRegression(xs, ys, model, paramNames, 'x');
    if (!f) return 'undefined';
    return paramNames.map(p => `${p}=${+f.params[p].toFixed(6)}`).join(',');
  };

  // Parse "y_n ~ expression" and fit. Updates `resultEl` with parameter summary.
  // Returns { plotFn, params, r2 } when a fit is produced, otherwise null.
  function computeRegression(latex, resultEl) {
    if (!latex || !latex.trim()) { resultEl.textContent = ''; return null; }
    const tildeRe = /^\s*([xy])_\{?(\d+)\}?\s*(?:\\sim|~)\s*(.+)$/;
    const tm = tildeRe.exec(latex);
    if (!tm) { resultEl.textContent = 'Use y_n ~ expression'; return null; }
    const depName = `${tm[1]}_${tm[2]}`;
    const rhs = latexToExpr(tm[3]);
    if (!rhs) { resultEl.textContent = 'Parse error'; return null; }
    const tbl = graphState.rows.find(r => r.type === 'table' && (r.xName === depName || r.yName === depName));
    if (!tbl) { resultEl.textContent = `Unknown column ${depName}`; return null; }
    const indepName = tbl.xName === depName ? tbl.yName : tbl.xName;
    const xs = [], ys = [];
    for (const r of tbl.rows) {
      const xv = parseFloat(tbl.xName === depName ? r[1] : r[0]);
      const yv = parseFloat(tbl.xName === depName ? r[0] : r[1]);
      if (Number.isFinite(xv) && Number.isFinite(yv)) { xs.push(xv); ys.push(yv); }
    }
    if (xs.length < 2) { resultEl.textContent = 'Need ≥2 data points'; return null; }
    let node;
    try { node = math.parse(rhs); } catch (_) { resultEl.textContent = 'Parse error'; return null; }
    const params = [...collectFreeSymbols(node)].filter(s => s !== indepName);
    if (params.length === 0) { resultEl.textContent = 'No free parameters'; return null; }
    // Linearity probe: second derivative wrt each param ≡ 0
    const isLinear = params.every(p => {
      try {
        const d2 = math.derivative(math.derivative(rhs, p), p).toString().replace(/\s/g, '');
        return d2 === '0';
      } catch (_) { return false; }
    });
    if (isLinear && params.length === 2) {
      const fit = linearRegression(xs, ys);
      if (!fit) { resultEl.textContent = 'Degenerate'; return null; }
      // Determine slope vs intercept by whether ∂(rhs)/∂p depends on indep
      const dependsOnIndep = p => {
        try {
          const d = math.derivative(rhs, p);
          const v0 = d.evaluate({ [indepName]: 0 });
          const v1 = d.evaluate({ [indepName]: 1 });
          return Math.abs(v1 - v0) > 1e-10;
        } catch (_) { return false; }
      };
      const bindings = {};
      for (const p of params) bindings[p] = dependsOnIndep(p) ? fit.m : fit.b;
      resultEl.textContent = params.map(p => `${p}=${bindings[p].toPrecision(4)}`).join(', ') + `, R²=${fit.r2.toFixed(4)}`;
      const subst = node.transform(n => {
        if (n.isSymbolNode && bindings.hasOwnProperty(n.name)) return new math.ConstantNode(bindings[n.name]);
        if (n.isSymbolNode && n.name === indepName) return new math.SymbolNode('x');
        return n;
      }).toString();
      return { plotFn: subst, params: bindings, r2: fit.r2 };
    }
    // Nonlinear path
    const fit = nonlinearRegression(xs, ys, rhs, params, indepName);
    if (!fit) { resultEl.textContent = 'Failed to fit'; return null; }
    resultEl.textContent = params.map(p => `${p}=${fit.params[p].toPrecision(4)}`).join(', ') + `, R²=${fit.r2.toFixed(4)}`;
    return fit;
  }

  // Add a regression row whose math-field accepts `y_n ~ model` syntax.
  function addRegressionRow() {
    const id = graphState.nextId++;
    const color = '#138a3d';
    const rowEl = document.createElement('div');
    rowEl.className = 'expr-row regression-row';
    rowEl.dataset.id = id;
    rowEl.innerHTML = `
      <div class="expr-color" style="background:${color}">
        <span class="sr-only">Regression</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 17q3-10 9-10t9 10"/></svg>
      </div>
      <math-field class="expr-field" aria-label="Regression model"></math-field>
      <div class="reg-result"></div>
      <button class="expr-delete" aria-label="Remove regression">×</button>
    `;
    const mf = rowEl.querySelector('math-field');
    mf.mathVirtualKeyboardPolicy = 'manual';
    const resultEl = rowEl.querySelector('.reg-result');
    mf.addEventListener('focus', () => { graphState.focusedMf = mf; });
    mf.addEventListener('input', () => {
      const rowObj = graphState.rows.find(r => r.id === id);
      if (rowObj) rowObj.fit = computeRegression(mf.value, resultEl);
      renderGraph();
    });
    rowEl.querySelector('.expr-delete').addEventListener('click', () => {
      graphState.rows = graphState.rows.filter(r => r.id !== id);
      rowEl.remove();
      renderGraph();
    });
    document.getElementById('expr-rows').appendChild(rowEl);
    graphState.rows.push({ id, type: 'regression', mathfield: mf, color, fit: null });
    mf.focus();
  }

  // Look up a numeric column array from any defined table by its x_n / y_n name.
  function getTableColumn(name) {
    for (const r of graphState.rows) {
      if (r.type === 'table') {
        if (r.xName === name) return r.rows.map(rr => parseFloat(rr[0])).map(v => Number.isFinite(v) ? v : null);
        if (r.yName === name) return r.rows.map(rr => parseFloat(rr[1])).map(v => Number.isFinite(v) ? v : null);
      }
    }
    return null;
  }

  // Substitute every SymbolNode whose name matches an existing slider with a
  // numeric ConstantNode holding that slider's current value. Returns the new
  // node (or the input unchanged if there are no matching sliders).
  function substituteSlidersNode(node) {
    return node.transform(n => {
      if (n.isSymbolNode && graphState.sliders[n.name]) {
        return new math.ConstantNode(graphState.sliders[n.name].value);
      }
      return n;
    });
  }

  // For every free symbol in `node` not in `scopeVars`, create a slider with
  // default value 1, then return the slider-substituted node. Skip symbols
  // that match an existing table column — those are arrays, not free scalars.
  // Also skip `y` (always the dependent variable, never a free parameter).
  function autoPromoteAndSubstitute(node, scopeVars) {
    const free = collectFreeSymbols(node);
    for (const name of free) {
      if (scopeVars.includes(name)) continue;
      if (name === 'y') continue;
      if (getTableColumn(name) !== null) continue;
      if (graphState.deletedSliders.has(name)) continue;
      if (!graphState.sliders[name]) addSliderRow(name);
    }
    return substituteSlidersNode(node);
  }

  // Collect "free" symbol names from a parsed math.js node — skip function-name
  // slots (e.g. the `cos` in `cos(t)`) and math.js built-ins (sqrt, log, etc.).
  function collectFreeSymbols(node) {
    const out = new Set();
    const fnNames = new Set();
    node.traverse((n) => {
      if (n.isFunctionNode && n.fn && n.fn.name) fnNames.add(n.fn.name);
    });
    node.traverse((n) => {
      if (!n.isSymbolNode) return;
      if (fnNames.has(n.name)) return;
      // Built-in math.js scope values (constants/functions) — skip
      try {
        const v = math.evaluate(n.name);
        if (typeof v === 'function' || typeof v === 'number') return;
      } catch (_) { /* not a builtin → it's free */ }
      out.add(n.name);
    });
    return out;
  }

  // Extract a piecewise restriction from a LaTeX string. Looks for `\{...\}`
  // at the very end where the outer braces are escaped (so `y=x^{2}\{x>0\}`
  // gives ["y=x^{2}", "x>0"]). Returns null if no escaped trailing brace pair.
  function extractPiecewise(latex) {
    if (!latex.endsWith('\\}')) return null;
    let depth = 1;
    let i = latex.length - 2;
    while (i > 0 && depth > 0) {
      i--;
      if (latex[i] === '\\' && latex[i + 1] === '}') { depth++; i--; continue; }
      if (latex[i] === '\\' && latex[i + 1] === '{') { depth--; continue; }
    }
    if (depth !== 0) return null;
    const condStart = i + 2;
    const condEnd = latex.length - 2;
    if (condStart >= condEnd) return null;
    return [latex.slice(0, i).trim(), latex.slice(condStart, condEnd).trim()];
  }

  // Rewrite a function-plot inequality fill path so it closes at the top
  // (`above=true`) or bottom (`above=false`) of the SVG viewport instead of
  // the y=0 baseline. The path's tail is a run of L commands all at the same
  // y (the closing baseline) — walk backward from the end and replace those y
  // values with the target edge.
  function reshadeInequalityPath(pathEl, above, svgHeight) {
    const d = pathEl.getAttribute('d');
    if (!d) return;
    const tokens = [...d.matchAll(/([MLT])([-\d.]+),([-\d.]+)|Z/g)].map(m =>
      m[0] === 'Z' ? { type: 'Z' } : { type: m[1], x: parseFloat(m[2]), y: parseFloat(m[3]) }
    );
    if (tokens.length < 3) return;
    let i = tokens.length - 1;
    if (tokens[i].type === 'Z') i--;
    if (i < 0) return;
    const baseline = tokens[i].y;
    const targetY = above ? 0 : svgHeight;
    while (i >= 0 && tokens[i].type !== 'Z' && Math.abs(tokens[i].y - baseline) < 0.5) {
      tokens[i] = { type: tokens[i].type, x: tokens[i].x, y: targetY };
      i--;
    }
    const rebuilt = tokens.map(c => c.type === 'Z' ? 'Z' : `${c.type}${c.x},${c.y}`).join('');
    pathEl.setAttribute('d', rebuilt);
  }

  // Parse "x > 0", "-2 < x < 5", "x >= 1 and x < 4", "x \\le \\pi" → [lo, hi]
  // Bounds evaluated via math.evaluate so \pi, sqrt(2), etc. are accepted.
  function parseRangeCondition(cond) {
    let s = cond
      .replace(/\\text\s*\{\s*and\s*\}/gi, ' and ')
      .replace(/\\le\b/g, '<=').replace(/\\ge\b/g, '>=')
      .replace(/\\leq\b/g, '<=').replace(/\\geq\b/g, '>=')
      .replace(/\\pi\b/g, 'pi').replace(/\\cdot\b/g, '*')
      .replace(/\s+/g, ' ').trim();
    const parts = s.split(/\s+and\s+/i);
    let lo = -Infinity, hi = Infinity;
    const evalBound = e => { try { const v = math.evaluate(e); return typeof v === 'number' ? v : NaN; } catch (_) { return NaN; } };
    for (const p of parts) {
      let m;
      if ((m = /^\s*(.+?)\s*(<=|<)\s*x\s*(<=|<)\s*(.+?)\s*$/.exec(p))) {
        const a = evalBound(m[1]), b = evalBound(m[4]);
        if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
        lo = Math.max(lo, a); hi = Math.min(hi, b);
      } else if ((m = /^\s*x\s*(<=|>=|<|>)\s*(.+?)\s*$/.exec(p))) {
        const v = evalBound(m[2]);
        if (!Number.isFinite(v)) return null;
        if (m[1] === '<' || m[1] === '<=') hi = Math.min(hi, v);
        else lo = Math.max(lo, v);
      } else if ((m = /^\s*(.+?)\s*(<=|>=|<|>)\s*x\s*$/.exec(p))) {
        const v = evalBound(m[1]);
        if (!Number.isFinite(v)) return null;
        if (m[2] === '<' || m[2] === '<=') lo = Math.max(lo, v);
        else hi = Math.min(hi, v);
      } else {
        return null;
      }
    }
    if (lo >= hi) return null;
    return [lo, hi];
  }

  // SR-only summary describing what's plotted. Re-set on every render so the
  // figcaption stays in sync with the visible graph.
  function updateGraphCaption(plottedData) {
    const cap = document.getElementById('graph-caption');
    if (!cap) return;
    const x = `x from ${graphSettings.xMin} to ${graphSettings.xMax}`;
    const y = `y from ${graphSettings.yMin} to ${graphSettings.yMax}`;
    if (!plottedData || plottedData.length === 0) {
      cap.textContent = `Empty graph. Visible domain: ${x}, ${y}.`;
      return;
    }
    const exprs = graphState.rows
      .map(r => r.mathfield?.value || '')
      .filter(Boolean)
      .map(latexToSpeech);
    const head = exprs.length === 1
      ? `Plot of ${exprs[0]}.`
      : `Plot of ${exprs.length} functions: ${exprs.join('; ')}.`;
    cap.textContent = `${head} Visible domain: ${x}, ${y}.`;
  }

  // SR-only sampled table — one row per (x, y) sample per plotted function.
  // Replaces the table contents each render. 21 samples gives enough fidelity
  // for screen-reader exploration without overwhelming the output.
  function updateGraphDataTable() {
    const host = document.getElementById('graph-data-table');
    if (!host) return;
    host.innerHTML = '';
    const SAMPLES = 21;
    const xMin = graphSettings.xMin, xMax = graphSettings.xMax;
    const step = (xMax - xMin) / (SAMPLES - 1);
    const exprs = graphState.rows
      .map(r => ({ latex: r.mathfield?.value || '', spec: latexToGraphableFn(r.mathfield?.value || '') }))
      .filter(e => e.spec && e.spec.fn && !e.spec.fnType);
    if (exprs.length === 0) { host.textContent = 'No functions plotted.'; return; }
    exprs.forEach((e, i) => {
      const fig = document.createElement('div');
      const heading = document.createElement('div');
      heading.textContent = `Function ${i + 1}: ${latexToSpeech(e.latex)}`;
      fig.appendChild(heading);
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th scope="col">x</th><th scope="col">y</th></tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      let node;
      try { node = math.parse(e.spec.fn); } catch (_) { return; }
      const compiled = node.compile();
      for (let k = 0; k < SAMPLES; k++) {
        const x = xMin + k * step;
        let y;
        try { y = compiled.evaluate({ x }); } catch (_) { y = NaN; }
        const tr = document.createElement('tr');
        const tdX = document.createElement('td');
        const tdY = document.createElement('td');
        tdX.textContent = x.toPrecision(4);
        tdY.textContent = Number.isFinite(y) ? Number(y).toPrecision(4) : 'undefined';
        tr.appendChild(tdX); tr.appendChild(tdY);
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      fig.appendChild(table);
      host.appendChild(fig);
    });
  }

  function renderGraph() {
    let graphEl = document.getElementById('graph');
    if (!graphEl || typeof functionPlot !== 'function') return;
    // Only render when the graphing view is actually visible (function-plot
    // needs a non-zero size to compute its viewport)
    if (!document.getElementById('view-graphing').classList.contains('active')) return;
    const data = [];
    const xInequalities = [];  // {x, right, strict, color} — drawn after function-plot
    // Snapshot rows because the dispatcher may auto-promote sliders (which
    // push new rows onto graphState.rows mid-iteration).
    const rowsSnapshot = [...graphState.rows];
    for (const r of rowsSnapshot) {
      if (r.type === 'regression') {
        if (r.fit && r.fit.plotFn) {
          data.push({ color: r.color, fn: r.fit.plotFn, graphType: 'polyline' });
        }
        continue;
      }
      // Skip slider and table rows — they don't plot directly
      if (r.type === 'slider' || r.type === 'table') continue;
      const spec = latexToGraphableFn(r.mathfield?.value || '');
      if (spec) {
        if (spec._xInequality) {
          // Vertical inequalities are drawn manually after function-plot renders.
          xInequalities.push({ ...spec._xInequality, color: r.color });
          continue;
        }
        // For implicit (and other non-linear) fnTypes, omit graphType — function-plot
        // chooses the right renderer based on fnType alone, and supplying both confuses it.
        const entry = { color: r.color, ...spec };
        if (!spec.fnType) entry.graphType = 'polyline';
        data.push(entry);
      }
    }
    // Replace the graph element with a fresh node. function-plot caches chart
    // state by element reference, so clearing innerHTML alone isn't enough —
    // pan/zoom and tick-scale state can persist across calls. Replacing the
    // node forces a clean re-init every render.
    const freshGraphEl = document.createElement('div');
    freshGraphEl.id = 'graph';
    freshGraphEl.setAttribute('role', 'img');
    freshGraphEl.setAttribute('aria-labelledby', 'graph-caption');
    graphEl.parentNode.replaceChild(freshGraphEl, graphEl);
    graphEl = freshGraphEl;
    updateGraphCaption(data);
    updateGraphDataTable();
    const cfg = {
      target: '#graph',
      grid: graphSettings.grid,
      width: graphEl.clientWidth || 800,
      height: graphEl.clientHeight || 500,
      xAxis: { domain: [graphSettings.xMin, graphSettings.xMax], label: graphSettings.xLabel || undefined },
      yAxis: { domain: [graphSettings.yMin, graphSettings.yMax], label: graphSettings.yLabel || undefined },
      data
    };
    let chart = null;
    try {
      chart = functionPlot(cfg);
    } catch (e) {
      try { chart = functionPlot({ ...cfg, data: [] }); } catch (_) {}
    }
    // Draw vertical inequalities (x ≥ c, x < c, etc.) manually — function-plot
    // is y=f(x) based and can't render vertical boundaries directly.
    if (xInequalities.length > 0 && chart && chart.meta) {
      const svgRoot = graphEl.querySelector('svg');
      const canvas = svgRoot?.querySelector('g.canvas');
      const xScale = chart.meta.xScale, yScale = chart.meta.yScale;
      if (svgRoot && canvas && xScale && yScale) {
        const innerH = yScale(graphSettings.yMin) - yScale(graphSettings.yMax);
        const innerW = xScale(graphSettings.xMax) - xScale(graphSettings.xMin);
        const xLeft = xScale(graphSettings.xMin), xRight = xScale(graphSettings.xMax);
        const yTop = yScale(graphSettings.yMax);
        for (const ineq of xInequalities) {
          const xPx = xScale(ineq.x);
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', ineq.right ? xPx : xLeft);
          rect.setAttribute('y', yTop);
          rect.setAttribute('width', ineq.right ? (xRight - xPx) : (xPx - xLeft));
          rect.setAttribute('height', innerH);
          rect.setAttribute('fill', ineq.color);
          rect.setAttribute('fill-opacity', '0.3');
          rect.setAttribute('pointer-events', 'none');
          canvas.appendChild(rect);
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', xPx); line.setAttribute('x2', xPx);
          line.setAttribute('y1', yTop); line.setAttribute('y2', yTop + innerH);
          line.setAttribute('stroke', ineq.color);
          line.setAttribute('stroke-width', '1.5');
          if (ineq.strict) line.setAttribute('stroke-dasharray', '6,4');
          line.setAttribute('pointer-events', 'none');
          canvas.appendChild(line);
        }
      }
    }
    // Post-process inequality fills: function-plot's `closed: true` always
    // closes the area down to y=0, which only shades correctly when the
    // boundary line happens to lie above zero. Rewrite each inequality path
    // so it closes at the appropriate viewport edge (top for `>` / `>=`,
    // bottom for `<` / `<=`), and dash the boundary for strict inequalities.
    {
      const svg = graphEl.querySelector('svg');
      if (svg) {
        const svgHeight = svg.clientHeight || cfg.height;
        const ineqMetas = data.map(d => d._inequality).filter(Boolean);
        // function-plot renders each closed/area entry as a path.line with
        // fill-opacity set. We assume DOM order matches data order.
        const closedPaths = [...svg.querySelectorAll('path.line')].filter(p => {
          const fo = p.getAttribute('fill-opacity');
          return fo && parseFloat(fo) > 0 && parseFloat(fo) < 1;
        });
        const ineqIndices = data.map((d, i) => d._inequality ? i : -1).filter(i => i >= 0);
        // Build a parallel array of closed paths in the same order as ineqMetas.
        // Since both `closedPaths` and `ineqIndices` are in render order, zip directly.
        ineqMetas.forEach((meta, i) => {
          const p = closedPaths[i];
          if (!p) return;
          reshadeInequalityPath(p, meta.above, svgHeight);
          if (meta.strict) p.setAttribute('stroke-dasharray', '6,4');
        });
      }
    }
    // Wire pan/zoom: as the user pans or scroll-zooms the graph, update
    // graphSettings and the settings panel inputs to reflect the new domain.
    if (chart && typeof chart.on === 'function') {
      const sync = () => syncZoomToSettings(chart);
      chart.on('all:zoom', sync);
      chart.on('all:zoom:end', sync);
    }
    // Apply custom axis tick spacing if step settings are set.
    if (graphSettings.xStep) applyCustomTicks('x', [graphSettings.xMin, graphSettings.xMax], graphSettings.xStep);
    if (graphSettings.yStep) applyCustomTicks('y', [graphSettings.yMin, graphSettings.yMax], graphSettings.yStep);
    // Apply visibility settings via CSS classes on the graph container.
    graphEl.classList.toggle('hide-x-axis', !graphSettings.showXAxis);
    graphEl.classList.toggle('hide-y-axis', !graphSettings.showYAxis);
    graphEl.classList.toggle('hide-axis-numbers', !graphSettings.axisNumbers);
    // Add minor gridlines and axis arrows as SVG overlays.
    applyMinorGridlines(graphSettings.minorGridlines && graphSettings.grid);
    applyAxisArrows(graphSettings.arrows);
  }

  // Add subtle minor gridlines halfway between each pair of major ticks.
  // (Reads the major tick positions; adds new <g class="tick minor-grid-line">
  // elements into the same axis groups so they live in the same coordinate
  // space and inherit panning if the chart redraws.)
  function applyMinorGridlines(enabled) {
    const svg = document.querySelector('#graph svg');
    if (!svg) return;
    svg.querySelectorAll('.minor-grid-line').forEach(el => el.remove());
    if (!enabled) return;
    ['x', 'y'].forEach(axis => {
      const axisG = svg.querySelector(`.${axis}.axis`);
      if (!axisG) return;
      const ticks = Array.from(axisG.querySelectorAll('.tick'));
      if (ticks.length < 2) return;
      // Use the first major tick's grid line length so minor lines match.
      const refLine = ticks[0].querySelector('line');
      if (!refLine) return;
      const lineAttr = axis === 'x' ? 'y2' : 'x2';
      const lineLen = refLine.getAttribute(lineAttr);
      if (!lineLen || lineLen === '0') return;
      const parseTransform = t => {
        const m = (t.getAttribute('transform') || '').match(/translate\(([-\d.]+)[,\s]+([-\d.]+)\)/);
        return m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : null;
      };
      for (let i = 0; i < ticks.length - 1; i++) {
        const p0 = parseTransform(ticks[i]);
        const p1 = parseTransform(ticks[i + 1]);
        if (!p0 || !p1) continue;
        const midX = (p0.x + p1.x) / 2;
        const midY = (p0.y + p1.y) / 2;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'tick minor-grid-line');
        g.setAttribute('transform', `translate(${midX},${midY})`);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('stroke', '#000');
        line.setAttribute('stroke-opacity', '0.06');
        line.setAttribute(lineAttr, lineLen);
        g.appendChild(line);
        axisG.appendChild(g);
      }
    });
  }

  // Add arrowheads at the ends of the x- and y-axis lines.
  // d3-axis paths zigzag (tick + line + tick), so marker-end lands on the
  // wrong vertex. Draw explicit small triangles at the correct positions.
  function applyAxisArrows(enabled) {
    const svg = document.querySelector('#graph svg');
    if (!svg) return;
    svg.querySelectorAll('.axis-arrow').forEach(el => el.remove());
    if (!enabled) return;
    // Extract chart bounds from the x-axis path "M0,-264V0H662V-264"
    // → horizontal axis spans x=0 → x=W where W = the H<W> coord.
    const xPath = svg.querySelector('.x.axis path.domain');
    const yPath = svg.querySelector('.y.axis path.domain');
    if (!xPath || !yPath) return;
    const xMatch = xPath.getAttribute('d').match(/H([-\d.]+)/);
    const yMatch = yPath.getAttribute('d').match(/M([-\d.]+),([-\d.]+)/);
    const W = xMatch ? parseFloat(xMatch[1]) : 0;
    const H = yMatch ? parseFloat(yMatch[2]) : 0;
    const xAxisG = svg.querySelector('.x.axis');
    const yAxisG = svg.querySelector('.y.axis');
    const triangle = (points, color) => {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      t.setAttribute('class', 'axis-arrow');
      t.setAttribute('points', points);
      t.setAttribute('fill', color || '#444');
      return t;
    };
    // x-axis: arrow at right end (x=W, y=0), pointing right
    if (xAxisG) {
      xAxisG.appendChild(triangle(`${W},-4 ${W + 8},0 ${W},4`));
    }
    // y-axis: arrow at top end (x=0, y=0 in y-axis local coords), pointing up.
    // The y-axis path starts at (W, H) and ends at (W, 0) — but its OWN
    // transform places (0,0) at the visual top of the axis. The y-axis group
    // is positioned with its origin at the *left* of the chart, so y=0 there
    // corresponds to the top of the visible chart area.
    if (yAxisG) {
      yAxisG.appendChild(triangle(`-4,0 0,-8 4,0`));
    }
  }

  // Mirror the user's pan/zoom into graphSettings + the input fields so they
  // stay in sync with what's actually visible. Re-applies custom step ticks
  // for the new domain. Does NOT call renderGraph (would loop).
  let suppressInputSync = false;
  function syncZoomToSettings(chart) {
    if (!chart || !chart.meta) return;
    const xDom = chart.meta.xScale && chart.meta.xScale.domain && chart.meta.xScale.domain();
    const yDom = chart.meta.yScale && chart.meta.yScale.domain && chart.meta.yScale.domain();
    suppressInputSync = true;
    const setInput = (id, v) => {
      const el = document.getElementById(id);
      if (el) el.value = formatBound(v);
    };
    if (xDom && xDom.length === 2 && Number.isFinite(xDom[0]) && Number.isFinite(xDom[1])) {
      graphSettings.xMin = xDom[0]; graphSettings.xMax = xDom[1];
      setInput('gs-xmin', xDom[0]); setInput('gs-xmax', xDom[1]);
    }
    if (yDom && yDom.length === 2 && Number.isFinite(yDom[0]) && Number.isFinite(yDom[1])) {
      graphSettings.yMin = yDom[0]; graphSettings.yMax = yDom[1];
      setInput('gs-ymin', yDom[0]); setInput('gs-ymax', yDom[1]);
    }
    // Re-apply custom step ticks for the new visible domain.
    if (graphSettings.xStep) applyCustomTicks('x', [graphSettings.xMin, graphSettings.xMax], graphSettings.xStep);
    if (graphSettings.yStep) applyCustomTicks('y', [graphSettings.yMin, graphSettings.yMax], graphSettings.yStep);
    suppressInputSync = false;
  }
  function formatBound(v) {
    if (Number.isInteger(v)) return String(v);
    // Trim to ~4 sig figs to keep the field readable while panning.
    return parseFloat(v.toPrecision(4)).toString();
  }

  // Rewrite axis ticks for an explicit step. We compute new tick positions
  // by mapping domain endpoints to the SVG x-range of the existing axis line.
  function applyCustomTicks(axis, domain, step) {
    if (!step || step <= 0) return;
    const axisG = document.querySelector(`#graph svg .${axis}.axis`);
    if (!axisG) return;
    const ticks = Array.from(axisG.querySelectorAll('.tick'));
    if (ticks.length < 1) return;
    // Read existing tick value & position to establish the px↔value scale.
    const parseVal = t => {
      const txt = (t.querySelector('text')?.textContent || '').replace(/[−–]/g, '-');
      return parseFloat(txt);
    };
    const parsePos = t => {
      const m = (t.getAttribute('transform') || '').match(/translate\(([-\d.]+)[,\s]+([-\d.]+)\)/);
      return m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : { x: 0, y: 0 };
    };
    // If only one tick, can't infer scale — bail.
    if (ticks.length < 2) return;
    const v0 = parseVal(ticks[0]), p0 = parsePos(ticks[0]);
    const v1 = parseVal(ticks[ticks.length - 1]), p1 = parsePos(ticks[ticks.length - 1]);
    if (!Number.isFinite(v0) || !Number.isFinite(v1) || v0 === v1) return;
    const isX = axis === 'x';
    const pxPerUnit = ((isX ? p1.x : p1.y) - (isX ? p0.x : p0.y)) / (v1 - v0);
    const basePx = isX ? p0.x : p0.y;
    const valToPx = v => basePx + (v - v0) * pxPerUnit;
    // Generate new tick values from domain & step.
    const [lo, hi] = domain;
    const start = Math.ceil(lo / step) * step;
    const newValues = [];
    for (let v = start; v <= hi + 1e-9; v = parseFloat((v + step).toPrecision(12))) {
      newValues.push(parseFloat(v.toPrecision(12)));
      if (newValues.length > 500) break; // safety
    }
    if (newValues.length === 0) return;
    const template = ticks[0].cloneNode(true);
    ticks.forEach(t => t.remove());
    const unicodeMinus = s => String(s).replace(/^-/, '−');
    newValues.forEach(v => {
      const t = template.cloneNode(true);
      t.setAttribute('transform', isX ? `translate(${valToPx(v)},0)` : `translate(0,${valToPx(v)})`);
      const text = t.querySelector('text');
      if (text) text.textContent = unicodeMinus(v);
      axisG.appendChild(t);
    });
  }

  // Function names that have native LaTeX commands (\sin, \cos, etc.)
  const NATIVE_LATEX_FNS = new Set([
    'sin','cos','tan','arcsin','arccos','arctan','asin','acos','atan',
    'ln','log','exp','sinh','cosh','tanh'
  ]);

  let shiftOn = false;

  function wireKeypad() {
    // Only target the scientific keypad. The graphing keypad has its own
    // handler (handleGraphKey); attaching this one too would steal focus from
    // the graphing math-field back to the scientific one, breaking physical
    // keyboard input in the graphing view.
    document.querySelectorAll('#view-scientific .key').forEach(k => {
      k.addEventListener('click', (e) => {
        e.preventDefault();
        if (k.classList.contains('is-disabled')) return;
        mf.focus();
        const insert = k.dataset.insert;
        const cmd = k.dataset.cmd;
        const fn = k.dataset.fn;
        const letter = k.dataset.letter;
        const latex = k.dataset.latex;
        // Smart-exit a placeholder template when the next key is an operator
        // (fixes the "x^{2+3x}" bug — see handleGraphKey for the same logic).
        if (_templateActive.get(mf) && insert !== undefined && isOperatorInsert(insert)) {
          try { mf.executeCommand('moveAfterParent'); } catch (e2) {}
          _templateActive.set(mf, false);
        }
        if (letter) {
          const ch = shiftOn ? letter.toUpperCase() : letter;
          mf.executeCommand(['insert', ch]);
          if (shiftOn) { shiftOn = false; updateShiftUI(); }
        } else if (insert !== undefined) {
          mf.executeCommand(['insert', insert]);
        } else if (latex) {
          mf.executeCommand(['insert', latex, { selectionMode: 'placeholder' }]);
        } else if (fn) {
          const body = NATIVE_LATEX_FNS.has(fn)
            ? `\\${fn}\\left(#0\\right)`
            : `\\operatorname{${fn}}\\left(#0\\right)`;
          mf.executeCommand(['insert', body, { selectionMode: 'placeholder' }]);
        } else if (cmd) {
          handleCmd(cmd);
        }
        // Update template-active flag for next keystroke
        const inserted = latex !== undefined ? latex
                       : fn !== undefined ? `\\fn\\left(#0\\right)`  // sentinel marking fn-template
                       : null;
        if (isTemplateLatex(inserted)) _templateActive.set(mf, true);
        else if (insert !== undefined && isOperatorInsert(insert)) _templateActive.set(mf, false);
      });
    });
  }

  function updateShiftUI() {
    const panel = document.querySelector('.panel[data-panel="abc"]');
    if (panel) panel.classList.toggle('shift-on', shiftOn);
    const shift = document.getElementById('abc-shift');
    if (shift) shift.setAttribute('aria-pressed', String(shiftOn));
  }

  function handleCmd(cmd) {
    switch (cmd) {
      case 'frac':
        mf.executeCommand(['insert', '\\frac{#0}{#?}', { selectionMode: 'placeholder' }]);
        break;
      case 'sqrt':
        mf.executeCommand(['insert', '\\sqrt{#0}', { selectionMode: 'placeholder' }]);
        break;
      case 'nthroot':
        mf.executeCommand(['insert', '\\sqrt[#?]{#0}', { selectionMode: 'placeholder' }]);
        break;
      case 'abs':
        mf.executeCommand(['insert', '\\left|#0\\right|', { selectionMode: 'placeholder' }]);
        break;
      case 'left':      mf.executeCommand('moveToPreviousChar'); break;
      case 'right':     mf.executeCommand('moveToNextChar'); break;
      case 'backspace': mf.executeCommand('deleteBackward'); break;
      case 'ans':
        if (lastAnswer !== null) mf.executeCommand(['insert', String(lastAnswer)]);
        break;
      case 'exp':
        mf.executeCommand(['insert', 'e^{#0}', { selectionMode: 'placeholder' }]);
        break;
      case 'shift':
        shiftOn = !shiftOn;
        updateShiftUI();
        break;
      case 'enter':     evaluate(); break;
    }
  }
